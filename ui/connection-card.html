<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>zSSH connection</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: transparent; color: var(--color-text-primary, inherit); }
    .card { width: 100%; min-width: 0; padding: 12px; display: grid; gap: 10px; }
    .top { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { min-width: 0; flex: 1 1 auto; display: grid; gap: 2px; }
    .brand strong { font-size: 14px; line-height: 1.2; }
    .target { min-width: 0; font-size: 12px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      flex: 0 1 auto; max-width: 48%; border: 1px solid currentColor; border-radius: 999px;
      padding: 3px 8px; font-size: 11px; font-weight: 600; text-align: center; overflow-wrap: anywhere;
    }
    .details { min-width: 0; display: grid; gap: 6px; font-size: 12px; }
    .row { min-width: 0; display: flex; justify-content: space-between; gap: 16px; }
    .key { flex: 0 0 auto; opacity: .68; }
    .value { min-width: 0; flex: 1 1 auto; text-align: right; overflow-wrap: anywhere; }
    .setup { display: grid; gap: 9px; border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent); padding-top: 10px; }
    .setup[hidden], .row[hidden] { display: none; }
    textarea, input {
      width: 100%; min-width: 0; border-radius: 8px; border: 1px solid currentColor;
      background: transparent; color: inherit; padding: 9px; font: 12px ui-monospace, monospace;
    }
    textarea { min-height: 110px; resize: vertical; overflow-wrap: anywhere; }
    .actionrow { display: flex; gap: 8px; flex-wrap: wrap; }
    .note { margin: 0; font-size: 11px; line-height: 1.35; opacity: .68; overflow-wrap: anywhere; }
    button {
      width: fit-content; min-height: 44px; border: 1px solid currentColor; border-radius: 8px;
      background: transparent; color: inherit; padding: 8px 12px; font: inherit; cursor: pointer;
    }
    button:disabled { cursor: default; opacity: .55; }

    @media (max-width: 360px) {
      .top { align-items: flex-start; flex-direction: column; gap: 8px; }
      .badge { max-width: 100%; }
      .row { align-items: flex-start; flex-direction: column; gap: 2px; }
      .value { width: 100%; text-align: left; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="brand">
        <strong>Connection status</strong>
        <span id="target" class="target">Linux target</span>
      </div>
      <span id="status" class="badge" role="status" aria-live="polite" aria-atomic="true">Checking…</span>
    </div>

    <div class="details">
      <div id="requestRow" class="row" hidden><span class="key">Pairing request</span><span id="request" class="value">—</span></div>
    </div>

    <section id="enroll" class="setup" hidden aria-label="One-command server installation">
      <p class="note">1. Generate a personal command. 2. Paste it into your Linux VPS terminal. 3. Confirm the exact fingerprint printed there.</p>
      <button id="install" type="button">Generate install command</button>
      <div id="commandPanel" class="setup" hidden>
        <label for="command">Your single-use installer (keep private)</label>
        <textarea id="command" readonly spellcheck="false" aria-label="Personal install command"></textarea>
        <div class="actionrow"><button id="copy" type="button">Copy command</button><span id="expiry" class="note"></span></div>
      </div>
      <div id="approvalPanel" class="setup" hidden>
        <strong>Confirm your VPS identity</strong>
        <div id="approvalTarget" class="value"></div>
        <label for="fingerprint">Fingerprint printed in your VPS terminal</label>
        <input id="fingerprint" autocomplete="off" spellcheck="false" placeholder="SHA256:..." aria-label="Confirm VPS fingerprint">
        <button id="approve" type="button" disabled>Approve this server</button>
      </div>
      <p id="enrollmentNote" class="note" aria-live="polite"></p>
    </section>

    <p id="note" class="note" aria-live="polite" aria-atomic="true">Approval stays local to the Linux target.</p>
    <button id="refresh" type="button" aria-describedby="note">Refresh status</button>
  </main>

  <script>
    const targetEl = document.getElementById("target");
    const statusEl = document.getElementById("status");
    const requestRowEl = document.getElementById("requestRow");
    const requestEl = document.getElementById("request");
    const noteEl = document.getElementById("note");
    const refreshEl = document.getElementById("refresh");

    const enrollEl = document.getElementById("enroll");
    const installEl = document.getElementById("install");
    const panelEl = document.getElementById("commandPanel");
    const commandEl = document.getElementById("command");
    const copyEl = document.getElementById("copy");
    const expiryEl = document.getElementById("expiry");
    const approvalEl = document.getElementById("approvalPanel");
    const approvalTargetEl = document.getElementById("approvalTarget");
    const fingerprintEl = document.getElementById("fingerprint");
    const approveEl = document.getElementById("approve");
    const enrollmentNoteEl = document.getElementById("enrollmentNote");
    let pendingTarget = null;
    const pending = new Map();
    let nextId = 1;

    function request(method, params) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function render(value) {
      if (!value || typeof value !== "object") return;
      if (Array.isArray(value.targets) || Array.isArray(value.pending)) {
        renderEnrollmentStatus(value);
        return;
      }
      if (typeof value.install_command === "string") {
        enrollEl.hidden = false;
        statusEl.textContent = "Install your server";
        commandEl.value = value.install_command;
        expiryEl.textContent = "Expires " + new Date(value.expires_at).toLocaleTimeString();
        panelEl.hidden = false;
        enrollmentNoteEl.textContent = "Only paste this command into a server you control. Do not share the code.";
        return;
      }
      targetEl.textContent = String(value.target_label || "Linux target");
      if (value.enrollment_enabled) {
        enrollEl.hidden = false;
        statusEl.textContent = value.paired ? "Connected" : value.pending ? "Approval needed" : "Ready to install";
        noteEl.textContent = value.paired ? "Your VPS is enrolled." : "Generate your personal install command below.";
        requestRowEl.hidden = true;
        return;
      }

      if (value.paired) {
        statusEl.textContent = "Connected";
        requestRowEl.hidden = true;
        noteEl.textContent = "This ChatGPT profile is paired with the Linux target.";
        return;
      }

      statusEl.textContent = value.pending ? "Approval needed" : "Not paired";
      requestRowEl.hidden = !value.request_id;
      requestEl.textContent = value.request_id ? String(value.request_id) : "—";
      noteEl.textContent = value.pending
        ? "Approve this short-lived request locally on the Linux target. ChatGPT cannot approve itself."
        : "Create a pairing request, then approve it locally on the Linux target.";
    }


    function renderEnrollmentStatus(value) {
      enrollEl.hidden = false;
      const targets = Array.isArray(value.targets) ? value.targets : [];
      const waiting = Array.isArray(value.pending) ? value.pending : [];
      statusEl.textContent = targets.length ? "Connected" : waiting.length ? "Approve server" : "Ready to install";
      requestRowEl.hidden = true;
      noteEl.textContent = targets.length
        ? "Server enrolled. An online outbound agent is required to execute requests."
        : "Paste the single command on your Linux VPS, then confirm its fingerprint.";
      if (waiting.length) {
        pendingTarget = waiting[0];
        approvalTargetEl.textContent = String(pendingTarget.target_id);
        approvalEl.hidden = false;
      } else {
        pendingTarget = null;
        approvalEl.hidden = true;
        fingerprintEl.value = "";
      }
      updateApprovalState();
    }

    function updateApprovalState() {
      approveEl.disabled = !pendingTarget ||
        fingerprintEl.value.trim() !== String(pendingTarget.fingerprint);
    }

    async function callTool(name, args = {}) {
      const response = await request("tools/call", { name, arguments: args });
      if (response?.isError) throw new Error("The zSSH server rejected this request.");
      return response?.structuredContent || {};
    }

    async function refreshStatus() {
      const initial = await callTool("get_pairing_status");
      render(initial);
      if (initial.enrollment_enabled) render(await callTool("get_server_enrollment_status"));
    }

    fingerprintEl.addEventListener("input", updateApprovalState);
    installEl.addEventListener("click", async () => {
      installEl.disabled = true;
      try {
        render(await callTool("get_server_install_command"));
      } catch {
        enrollmentNoteEl.textContent = "Could not generate an install command. Check your account connection.";
      } finally {
        installEl.disabled = false;
      }
    });
    copyEl.addEventListener("click", async () => {
      commandEl.focus();
      commandEl.select();
      try {
        await navigator.clipboard.writeText(commandEl.value);
        enrollmentNoteEl.textContent = "Command copied. Treat it as a one-time secret.";
      } catch {
        enrollmentNoteEl.textContent = "Command selected. Copy it using Ctrl+C.";
      }
    });
    approveEl.addEventListener("click", async () => {
      if (!pendingTarget || fingerprintEl.value.trim() !== pendingTarget.fingerprint) return;
      approveEl.disabled = true;
      try {
        await callTool("approve_server_enrollment", {
          target_id: pendingTarget.target_id,
          fingerprint: fingerprintEl.value.trim()
        });
        enrollmentNoteEl.textContent = "Fingerprint confirmed. Connecting your Linux server.";
        await refreshStatus();
      } catch {
        enrollmentNoteEl.textContent = "Approval failed. Confirm the target and try again.";
      } finally {
        updateApprovalState();
      }
    });

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;

      if (message.id !== undefined && pending.has(message.id)) {
        const waiter = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) waiter.reject(message.error);
        else waiter.resolve(message.result);
        return;
      }

      if (message.method === "ui/notifications/tool-result") {
        render(message.params?.structuredContent);
      }
    }, { passive: true });

    if (window.openai?.toolOutput) render(window.openai.toolOutput);

    refreshEl.addEventListener("click", async () => {
      refreshEl.disabled = true;
      refreshEl.setAttribute("aria-busy", "true");
      try {
        await refreshStatus();
      } catch {
        noteEl.textContent = "Could not refresh the pairing status.";
      } finally {
        refreshEl.disabled = false;
        refreshEl.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
