name: zSSH public ingress external preflight

on:
  workflow_run:
    workflows: ["zSSH production DNS publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-public-ingress-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Prove public DNS, TLS, health and MCP auth boundary
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZSSH_PLUGIN_MCP_URL: https://zssh.cheapgpt.shop/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require successful canonical production DNS source
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          ZSSH_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ZSSH_SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ZSSH_SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          ZSSH_EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          test "$ZSSH_SOURCE_CONCLUSION" = "success"
          test "$ZSSH_SOURCE_HEAD_BRANCH" = "main"
          test "$ZSSH_SOURCE_REPOSITORY" = "$ZSSH_EXPECTED_REPOSITORY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Bind automatic preflight to exact current protected main
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZSSH_EXPECTED_CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Require canonical protected-main manual preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Run external ingress preflight
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-public-ingress-preflight.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-public-ingress.mjs "$ZSSH_PLUGIN_MCP_URL" | tee "$EVIDENCE_PATH"
      - name: Upload non-secret ingress evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-public-ingress-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-public-ingress-preflight.json
          if-no-files-found: error
          retention-days: 30
