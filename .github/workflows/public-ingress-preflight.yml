name: zSSH public ingress external preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-public-ingress-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Prove public DNS, TLS, health and MCP auth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZSSH_PLUGIN_MCP_URL: https://zssh.cheapgpt.shop/mcp
      ZSSH_EXPECTED_PUBLIC_ADDRESSES: 198.244.191.182
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Require canonical protected-main manual preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Run external ingress preflight
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-public-ingress-preflight.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-public-ingress.mjs "$ZSSH_PLUGIN_MCP_URL" "$ZSSH_EXPECTED_PUBLIC_ADDRESSES" | tee "$EVIDENCE_PATH"
      - name: Upload non-secret ingress evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-public-ingress-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-public-ingress-preflight.json
          if-no-files-found: error
          retention-days: 30
