name: zSSH public ingress external preflight

on:
  workflow_run:
    workflows: ["zSSH production DNS publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-public-ingress-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Prove public DNS, TLS, health and MCP auth boundary
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZSSH_PLUGIN_MCP_URL: https://zssh.cheapgpt.shop/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require successful canonical production DNS source
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Require canonical protected-main manual preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Run external ingress preflight
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-public-ingress-preflight.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/check-public-ingress.mjs "$ZSSH_PLUGIN_MCP_URL" | tee "$EVIDENCE_PATH"
      - name: Upload non-secret ingress evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zssh-public-ingress-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-public-ingress-preflight.json
          if-no-files-found: error
          retention-days: 30
