name: Recover FTMO main5335 after PR471

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-main5335-pr471-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-main5335-pr471-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      MAIN_SHA: 5335e0e17d3a1c35a40698cd2beebebdcdb26f8b
      STALE_SHA: 5594b2a1d310fd967b187ae637296727bfc3a8c7
      STALE_RUNS: '37161062903 37161062966'
      VERIFY_RUN: '37161253628'
      MAIN_TEST_RUN: '37161253624'
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
    steps:
      - name: Prove exact FTMO identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$MAIN_SHA"
          pr="$(gh api repos/Zennay/Ftmo/pulls/471)"
          test "$(jq -r .merged <<<"$pr")" = "true"
          test "$(jq -r .head.sha <<<"$pr")" = "$STALE_SHA"
          for rid in $STALE_RUNS; do
            test "$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .head_sha)" = "$STALE_SHA"
          done
          for rid in "$VERIFY_RUN" "$MAIN_TEST_RUN"; do
            test "$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .head_sha)" = "$MAIN_SHA"
            test "$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .event)" = "push"
          done
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$VERIFY_RUN --jq .name)" = "Verify autonomous VPS runtime"
          echo "FTMO_MAIN5335_IDENTITIES=verified"

      - name: Cancel only queued superseded PR471 proofs
        shell: bash
        run: |
          set -euo pipefail
          for rid in $STALE_RUNS; do
            status="$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .status)"
            case "$status" in
              queued|pending)
                gh api --method POST "repos/Zennay/Ftmo/actions/runs/$rid/cancel" >/dev/null
                echo "CANCELLED_STALE_PR471=$rid"
                ;;
              in_progress)
                echo "refusing to interrupt newly-started proof=$rid" >&2
                exit 1
                ;;
              completed)
                echo "ALREADY_TERMINAL=$rid"
                ;;
              *)
                echo "unexpected_status=$status run=$rid" >&2
                exit 1
                ;;
            esac
          done

      - name: Recover dedicated FTMO listener only when idle
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          listener=0
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pid/cmdline"; then
            cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
            [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]] && listener=1 || true
          fi
          echo "FTMO_RUNNER_PRE state=$state pid=$pid worker=$worker listener=$listener"
          ps -o pid=,ppid=,lstart=,etime=,cmd= -u "$FTMO_RUN_USER" | grep -E 'Runner\.(Worker|Listener)|runsvc\.sh' || true

          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-idle-listener
          fi

          post_state=""
          post_pid=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
            if [[ "$post_state" == active && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
              post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]] && break
            fi
            sleep 2
          done
          test "$post_state" = active
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"

      - name: Prove canonical main run starts
        shell: bash
        run: |
          set -euo pipefail
          scheduled=""
          for _ in $(seq 1 48); do
            verify_status="$(gh api repos/Zennay/Ftmo/actions/runs/$VERIFY_RUN --jq .status)"
            test_status="$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_TEST_RUN --jq .status)"
            echo "FTMO_MAIN5335 verify=$verify_status test=$test_status"
            if [[ "$verify_status" == in_progress || "$verify_status" == completed ]]; then
              scheduled="$VERIFY_RUN"
              break
            fi
            if [[ "$test_status" == in_progress || "$test_status" == completed ]]; then
              scheduled="$MAIN_TEST_RUN"
              break
            fi
            sleep 5
          done
          test -n "$scheduled"
          echo "FTMO_MAIN5335_SCHEDULING_GREEN=$scheduled"

      - name: Persist zSSH recovery receipt
        if: always()
        env:
          RECOVERY_ACTION: ${{ steps.recover.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ftmo-main5335-zssh-recovery.json
          import json, os, subprocess
          ids=[*os.environ["STALE_RUNS"].split(),os.environ["VERIFY_RUN"],os.environ["MAIN_TEST_RUN"]]
          runs=[]
          for rid in ids:
              d=json.loads(subprocess.check_output(["gh","api",f"repos/Zennay/Ftmo/actions/runs/{rid}"],text=True))
              runs.append({"run_id":int(rid),"name":d.get("name"),"status":d.get("status"),"conclusion":d.get("conclusion"),"head_sha":d.get("head_sha")})
          print(json.dumps({
              "scope":"ftmo-main5335-pr471-zssh-recovery",
              "main_sha":os.environ["MAIN_SHA"],
              "stale_sha":os.environ["STALE_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "recovery_action":os.environ.get("RECOVERY_ACTION"),
              "runs":runs
          },sort_keys=True,indent=2))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-main5335-zssh-recovery.json)"
          dest="runtime-evidence/ftmo-main5335-pr471-zssh-recovery-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$dest"             -f message="Record FTMO main5335 zSSH recovery $GITHUB_RUN_ID"             -f content="$encoded" >/dev/null
          echo "FTMO_ZSSH_RECOVERY_RECEIPT=$dest"
