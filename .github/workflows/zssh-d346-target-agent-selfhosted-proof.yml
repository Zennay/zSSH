name: zSSH d346 self-hosted deployment proof

on:
  push:
    paths:
      - ".github/workflows/zssh-d346-target-agent-selfhosted-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical deployment commit
        uses: actions/checkout@v4
        with:
          ref: d346051d64953dcf260cfeb78214249026e17dc1
          fetch-depth: 1

      - name: Verify exact head and VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "d346051d64953dcf260cfeb78214249026e17dc1"
          echo "runner=$RUNNER_NAME"
          echo "hostname=$(hostname)"
          echo "sha=$(git rev-parse HEAD)"

      - name: Install and test canonical target-agent slice
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node --test test/agent-pairing-control.test.mjs test/agent-client.test.mjs test/agent-identity.test.mjs test/deploy.test.mjs
          bash -n deploy/install-target-agent.sh
          node --check scripts/create-agent-identity.mjs

      - name: Verify identity and tracked-only release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          proof_home="$RUNNER_TEMP/zssh-d346-selfhosted"
          rm -rf "$proof_home"
          mkdir -p "$proof_home"
          output="$(HOME="$proof_home" npm run --silent agent:init -- zt_vpsproof1234 "$proof_home/.config/zssh/agent-ed25519.pem")"
          printf '%s\n' "$output" | grep -F '"private_key_printed": false'
          ! printf '%s\n' "$output" | grep -F 'BEGIN PRIVATE KEY'
          test "$(stat -c '%a' "$proof_home/.config/zssh")" = "700"
          test "$(stat -c '%a' "$proof_home/.config/zssh/agent-ed25519.pem")" = "600"
          printf 'SHOULD_NOT_SHIP=secret\n' > .env
          stage="$RUNNER_TEMP/zssh-d346-release-export"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar d346051d64953dcf260cfeb78214249026e17dc1 | tar -x -C "$stage"
          test ! -e "$stage/.env"
          test -f "$stage/deploy/install-target-agent.sh"
          rm -rf "$proof_home" "$stage" .env
          echo "ZSSH_D346_SELFHOSTED_PROOF_GREEN"
