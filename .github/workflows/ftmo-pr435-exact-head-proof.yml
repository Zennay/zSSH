name: Retire completed FTMO PR435 proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr435-exact-head-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr435-exact-head-proof
  cancel-in-progress: true

jobs:
  retired:
    if: ${{ false }}
    runs-on: self-hosted
    steps:
      - run: echo retired
