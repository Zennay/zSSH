name: FTMO PR435 exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr435-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr435-exact-head-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TARGET_SHA: 0c3b81e7afe641ddd78084c4321cd3b4d590b2cb
    steps:
      - name: Verify VPS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "runner_host=$(hostname)"

      - name: Fetch exact FTMO PR435 head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr435-exact"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr435-exact"
          venv="$RUNNER_TEMP/ftmo-pr435-exact-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove BI5 transport boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr435-exact"
          venv="$RUNNER_TEMP/ftmo-pr435-exact-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_public.py
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_public.py -k 'default_fetch'
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_public.py tests/test_dukascopy_timeout_transport.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_provider_retry.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free

      - name: Prove full exact-head suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr435-exact"
          venv="$RUNNER_TEMP/ftmo-pr435-exact-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q
