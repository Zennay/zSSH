name: zSSH public origin watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: zssh-public-origin-watch
  cancel-in-progress: true

jobs:
  observe:
    name: Observe public production origin
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Observe DNS, HTTPS, MCP auth and OAuth metadata
        shell: bash
        env:
          ORIGIN_REPORT_PATH: ${{ runner.temp }}/zssh-public-origin-observation.json
        run: |
          set -Eeuo pipefail
          node scripts/observe-public-origin-readiness.mjs https://zssh.cheapgpt.shop/mcp | tee "$ORIGIN_REPORT_PATH"
      - name: Summarize public origin state
        shell: bash
        env:
          ORIGIN_REPORT_PATH: ${{ runner.temp }}/zssh-public-origin-observation.json
        run: |
          set -Eeuo pipefail
          node --input-type=module - "$ORIGIN_REPORT_PATH" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const lines = [
            "# zSSH public origin watch",
            "",
            `- URL: ${result.mcp_url}`,
            `- Ready: ${result.ready ? "yes" : "no"}`,
            `- Current stage: ${result.stage}`,
          ];
          if (result.reason) lines.push(`- Reason: ${result.reason}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
      - name: Upload public origin observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-public-origin-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-public-origin-observation.json
          if-no-files-found: error
          retention-days: 7
