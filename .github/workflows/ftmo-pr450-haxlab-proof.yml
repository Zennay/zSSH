name: FTMO PR450 targeted proof via HaxLab runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr450-haxlab-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr450-haxlab-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      TARGET_SHA: 418c90334c53ee7f70b12d4f1486c4054c616e6c
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr450-haxlab"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr450-haxlab"
          venv="$RUNNER_TEMP/ftmo-pr450-haxlab-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile provider-validation boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr450-haxlab"
          venv="$RUNNER_TEMP/ftmo-pr450-haxlab-venv"
          "$venv/bin/python" -m compileall -q "$src/src/prop_trading_ai/research/provider_validation.py"

      - name: Run focused exact-head regressions
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr450-haxlab"
          venv="$RUNNER_TEMP/ftmo-pr450-haxlab-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_provider_validation_json_integrity.py \
            tests/test_provider_validation.py \
            tests/test_provider_foundation_publication.py \
            tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR450_HAXLAB_TARGETED_GREEN=1"

      - name: Persist proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr450-haxlab-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project": "ftmo",
              "pr": 450,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": os.environ.get("FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"),
              "proof": [
                  "exact-sha-checkout",
                  "isolated-install",
                  "compile-provider-validation",
                  "provider-validation-integrity-tests",
                  "provider-foundation-publication-tests",
                  "zero-cost-boundary-tests"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr450-haxlab-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path" \
            -f message="Record FTMO PR450 HaxLab proof run ${GITHUB_RUN_ID}" \
            -f content="$encoded" >/dev/null
          echo "FTMO_PR450_HAXLAB_RECEIPT_PATH=$path"
