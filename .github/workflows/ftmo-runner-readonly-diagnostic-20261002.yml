name: FTMO runner read-only diagnostic 2026-10-02

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runner-readonly-diagnostic-20261002.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 3
    steps:
      - name: Prove FTMO runner listener and current worker state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          state="$(systemctl is-active "$SERVICE" || true)"
          pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          echo "FTMO_DIAG_SERVICE=$SERVICE"
          echo "FTMO_DIAG_STATE=$state"
          echo "FTMO_DIAG_PID=$pid"
          test "$state" = "active"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          echo "FTMO_DIAG_LISTENER_CMDLINE=$cmdline"
          [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]
          echo "FTMO_DIAG_PROCESSES_BEGIN"
          ps -o pid=,ppid=,lstart=,etime=,cmd= -u ftmo-runner | grep -E 'Runner\.(Worker|Listener)|runsvc\.sh' || true
          echo "FTMO_DIAG_PROCESSES_END"
          latest="$(ls -1t /opt/ftmo-runner/_diag/Runner_*.log 2>/dev/null | head -1 || true)"
          echo "FTMO_DIAG_FILE=$latest"
          if [ -n "$latest" ]; then
            echo "FTMO_DIAG_TAIL_BEGIN"
            grep -Eai 'Listening for Jobs|Running job|finish job request|Job request|shutdown|signal|session|Busy' "$latest" | tail -200 || true
            echo "FTMO_DIAG_TAIL_END"
          fi
          echo "FTMO_MEMORY_BEGIN"
          free -m || true
          echo "FTMO_MEMORY_END"
