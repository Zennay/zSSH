name: OpenAI production readiness audit

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: zssh-openai-production-readiness
  cancel-in-progress: true

jobs:
  provenance:
    name: Canonical main provenance
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_protected: ${{ steps.main-protection.outputs.protected }}
      governance_verified: ${{ steps.governance-evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Bind merged PR event to canonical main SHA
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGED_PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -Eeuo pipefail
          test -n "$MERGED_PR_SHA"
          test "$GITHUB_SHA" = "$MERGED_PR_SHA"
      - name: Require candidate SHA to originate from a merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-main-provenance.mjs
      - name: Inspect live main protection
        id: main-protection
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPORT_PATH="$RUNNER_TEMP/zssh-main-protection-status.json"
          node scripts/check-main-protection.mjs --public-status | sed "s/^ZSSH_MAIN_PROTECTION_STATUS //" | tee "$REPORT_PATH"
          PROTECTED="$(node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(result.protected === true ? "1" : "0");' "$REPORT_PATH")"
          echo "protected=$PROTECTED" >> "$GITHUB_OUTPUT"
      - name: Verify immutable rejected-direct-write governance evidence
        id: governance-evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          node scripts/check-main-protection.mjs --require-negative-proof
          echo "verified=1" >> "$GITHUB_OUTPUT"

  public_origin:
    name: Observe public production origin
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Observe DNS, HTTPS, MCP auth and OAuth metadata
        shell: bash
        env:
          ORIGIN_REPORT_PATH: ${{ runner.temp }}/zssh-public-origin-observation.json
        run: |
          set -Eeuo pipefail
          node scripts/observe-public-origin-readiness.mjs https://zssh.cheapgpt.shop/mcp | tee "$ORIGIN_REPORT_PATH"
      - name: Summarize public origin state
        shell: bash
        env:
          ORIGIN_REPORT_PATH: ${{ runner.temp }}/zssh-public-origin-observation.json
        run: |
          set -Eeuo pipefail
          node --input-type=module - "$ORIGIN_REPORT_PATH" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const lines = [
            "# zSSH public origin observation",
            "",
            `- URL: ${result.mcp_url}`,
            `- Ready: ${result.ready ? "yes" : "no"}`,
            `- Current stage: ${result.stage}`,
          ];
          if (result.reason) lines.push(`- Reason: ${result.reason}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
      - name: Upload public origin observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zssh-public-origin-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-public-origin-observation.json
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Classify protected M5 inputs
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openai-production
    env:
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZSSH_PLUGIN_MCP_URL: ${{ vars.ZSSH_PLUGIN_MCP_URL || 'https://zssh.cheapgpt.shop/mcp' }}
      ZSSH_PLUGIN_DEMO_RECORDING_URL: ${{ vars.ZSSH_PLUGIN_DEMO_RECORDING_URL }}
      ZSSH_REVIEW_ACCESS_TOKEN: ${{ secrets.ZSSH_REVIEW_ACCESS_TOKEN }}
      ZSSH_REVIEW_LOGIN_URL: ${{ vars.ZSSH_REVIEW_LOGIN_URL }}
      ZSSH_REVIEW_LOGIN_VERIFIED_URL: ${{ vars.ZSSH_REVIEW_LOGIN_VERIFIED_URL }}
      ZSSH_REVIEW_CREDENTIALS_VERIFIED: ${{ vars.ZSSH_REVIEW_CREDENTIALS_VERIFIED }}
      ZSSH_MAIN_PROTECTION_VERIFIED: ${{ needs.provenance.outputs.governance_verified }}
      ZSSH_MAIN_BRANCH_PROTECTED: ${{ needs.provenance.outputs.main_protected }}
      ZSSH_CHATGPT_DESKTOP_REVIEWED: ${{ vars.ZSSH_CHATGPT_DESKTOP_REVIEWED }}
      ZSSH_CHATGPT_MOBILE_REVIEWED: ${{ vars.ZSSH_CHATGPT_MOBILE_REVIEWED }}
      ZSSH_CHATGPT_REVIEW_SHA256: ${{ vars.ZSSH_CHATGPT_REVIEW_SHA256 }}
      ZSSH_OPENAI_DOMAIN_VERIFIED: ${{ vars.ZSSH_OPENAI_DOMAIN_VERIFIED }}
      ZSSH_OPENAI_VERIFIED_MCP_ORIGIN: ${{ vars.ZSSH_OPENAI_VERIFIED_MCP_ORIGIN }}
      ZSSH_OPENAI_TOOL_SCAN_VERIFIED: ${{ vars.ZSSH_OPENAI_TOOL_SCAN_VERIFIED }}
      ZSSH_OPENAI_TOOL_SCAN_SHA256: ${{ vars.ZSSH_OPENAI_TOOL_SCAN_SHA256 }}
      ZSSH_OAUTH_ISSUER: ${{ vars.ZSSH_OAUTH_ISSUER }}
      AUTH0_MANAGEMENT_BASE_URL: ${{ vars.AUTH0_MANAGEMENT_BASE_URL }}
      AUTH0_MANAGEMENT_API_TOKEN: ${{ secrets.AUTH0_MANAGEMENT_API_TOKEN }}
      OPENAI_APPS_CHALLENGE_TOKEN: ${{ secrets.OPENAI_APPS_CHALLENGE_TOKEN }}
      ZSSH_REVIEW_FILE: ${{ vars.ZSSH_REVIEW_FILE || '/srv/zssh-review/sample.txt' }}
      ZSSH_REVIEW_WRITE_FILE: ${{ vars.ZSSH_REVIEW_WRITE_FILE || '/srv/zssh-review/output.txt' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build secret-safe readiness receipt
        shell: bash
        env:
          READINESS_PATH: ${{ runner.temp }}/zssh-openai-production-readiness.json
        run: |
          set -Eeuo pipefail
          node scripts/check-production-readiness-audit.mjs | tee "$READINESS_PATH"
      - name: Summarize next executable lanes
        shell: bash
        env:
          READINESS_PATH: ${{ runner.temp }}/zssh-openai-production-readiness.json
        run: |
          set -Eeuo pipefail
          node --input-type=module - "$READINESS_PATH" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const lines = [
            "# zSSH M5 production readiness",
            "",
            `- Main protection: ${result.ready.repository_governance ? "verified" : "not ready"}`,
            `- DNS publication inputs: ${result.ready.dns_publication ? "ready" : "not ready"}`,
            `- Auth0 preflight inputs: ${result.ready.auth0_preflight ? "ready" : "not ready"}`,
            `- Reviewer fixture inputs: ${result.ready.reviewer_fixture ? "ready" : "not ready"}`,
            `- Portal/host attestations: ${result.ready.portal_and_host_attestations ? "ready" : "pending"}`,
            `- Final release config validation: ${result.ready.final_release_config ? "green" : "not ready"}`,
            `- Execution state: ${result.execution_state}`,
            `- Blocking gate: ${result.blocking_gate || "none"}`,
            `- Internal action gates: ${result.internal_action_gates.join(", ") || "none"}`,
            `- External input gates: ${result.external_input_gates.join(", ") || "none"}`,
            "",
            "## Next actions",
            ...result.next_actions.flatMap(item => [
              `- **${item.lane}** — ${item.action}`,
              `  - Gate kind: ${item.gate_kind}`,
              `  - Requires external input: ${item.requires_external_input ? "yes" : "no"}`,
              `  - Missing: ${item.missing.join(", ") || "none"}`,
              `  - Invalid: ${(item.invalid || []).map(issue => `${issue.name}: ${issue.reason}`).join("; ") || "none"}`,
            ]),
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
      - name: Upload non-secret readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zssh-openai-production-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-openai-production-readiness.json
          if-no-files-found: error
          retention-days: 30
