name: FTMO PR484 tick-lock exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr484-tick-lock-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr484-tick-lock-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TARGET_SHA: 346a5b233e72cf9f264f073c3ec0913333ff4a36
      TARGET_PR: "484"
      EXPECTED_MAIN_SHA: bbeb4954b08fd88444d65c1adad43d667089b973
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Prove exact FTMO PR484 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          src="$RUNNER_TEMP/ftmo-pr484-zssh-$GITHUB_RUN_ID"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" fetch --no-tags origin "$TARGET_SHA"
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main=subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main","--jq",".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          PY
          venv="$RUNNER_TEMP/ftmo-pr484-zssh-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/autonomous_runtime.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_runtime.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          echo "FTMO_PR484_TICK_LOCK_PROOF=success"

      - name: Persist proof receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ftmo-pr484-proof-$GITHUB_RUN_ID.json"
          python3 - <<'PY' > "$receipt"
          import json, os
          print(json.dumps({
              "schema_version":1,
              "project":"ftmo",
              "pull_request":484,
              "target_sha":os.environ["TARGET_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner":os.environ.get("RUNNER_NAME",""),
              "host":"vps-bb300bba",
              "result":"success",
              "proof":[
                  "exact-sha-checkout",
                  "autonomous-runtime-compile",
                  "no-follow-lock-parent",
                  "no-follow-lock-file",
                  "lock-owner-permission-link-seal",
                  "post-flock-path-inode-revalidation",
                  "concurrent-lock-regression",
                  "zero-cost-boundary"
              ],
              "paid_cloud_budget_usd":"0.00",
              "research_outcomes_accessed":False,
              "walk_forward_accessed":False,
              "final_holdout_accessed":False
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr484-tick-lock-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path" \
            -f message="Record FTMO PR484 exact-head proof $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr484-zssh-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr484-zssh-venv-$GITHUB_RUN_ID"
