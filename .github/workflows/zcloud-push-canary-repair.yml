name: zCloud push canary repair via zSSH

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-push-canary-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-push-canary-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    steps:
      - name: Verify VPS and fetch pinned zCloud repair source
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          sha="489d34fb02666fd2fb7f490c4ee0f22651f2d1a4"
          mkdir -p "$RUNNER_TEMP/zcloud-repair/public"
          curl -fsSL "https://raw.githubusercontent.com/Zennay/zCloud/$sha/server.py" -o "$RUNNER_TEMP/zcloud-repair/server.py"
          curl -fsSL "https://raw.githubusercontent.com/Zennay/zCloud/$sha/public/zcloud-worker.user.js" -o "$RUNNER_TEMP/zcloud-repair/public/zcloud-worker.user.js"
          python3 -m py_compile "$RUNNER_TEMP/zcloud-repair/server.py"
          node --check "$RUNNER_TEMP/zcloud-repair/public/zcloud-worker.user.js"
          grep -Fq '// @version      1.3.4' "$RUNNER_TEMP/zcloud-repair/public/zcloud-worker.user.js"
          ! grep -Fq 'prompt-missing-queue-line' "$RUNNER_TEMP/zcloud-repair/public/zcloud-worker.user.js"
          ! grep -Fq 'prompt-missing-worker-line' "$RUNNER_TEMP/zcloud-repair/public/zcloud-worker.user.js"
          ! grep -Fq 'prompt-missing-queue-line' "$RUNNER_TEMP/zcloud-repair/server.py"
          ! grep -Fq 'prompt-missing-worker-line' "$RUNNER_TEMP/zcloud-repair/server.py"
          grep -Fq "'text_boilerplate_required': False" "$RUNNER_TEMP/zcloud-repair/server.py"
          echo "PINNED_REPAIR_SOURCE_GREEN=1"

      - name: Surgically remove live legacy prompt obligation
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          candidate="$RUNNER_TEMP/zcloud-repair"
          backup="$HOME/.local/state/zcloud/zssh-push-canary-repair/$GITHUB_RUN_ID"
          mkdir -p "$backup"
          cp -a "$root/server.py" "$backup/server.py"
          cp -a "$root/public/zcloud-worker.user.js" "$backup/zcloud-worker.user.js"

          python3 - "$root" "$candidate" <<'PY'
          from pathlib import Path
          import ast, os, shutil, sys

          root=Path(sys.argv[1])
          candidate=Path(sys.argv[2])
          live_path=root/"server.py"
          desired_path=candidate/"server.py"
          live=live_path.read_text(encoding="utf-8")
          desired=desired_path.read_text(encoding="utf-8")

          def span(source,name):
              tree=ast.parse(source)
              node=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name),None)
              if node is None:
                  raise SystemExit(f"{name} missing")
              lines=source.splitlines(keepends=True)
              return lines,node.lineno-1,node.end_lineno

          desired_lines,ds,de=span(desired,"worker_contract_failures")
          replacement="".join(desired_lines[ds:de])
          live_lines,ls,le=span(live,"worker_contract_failures")
          live_lines[ls:le]=[replacement]
          patched="".join(live_lines)

          old_meta=("'contract': {'worker_line': 'Jij bent Worker <slot>/<total>.', "
                    "'queue_line': 'VPS_QUEUE_ASSIGNMENT id=<queue_id>'}")
          new_meta=("'contract': {'prompt': 'project-first', "
                    "'queue_binding': 'structured-metadata', "
                    "'text_boilerplate_required': False}")
          if old_meta in patched:
              patched=patched.replace(old_meta,new_meta,1)
          elif new_meta not in patched:
              raise SystemExit("live worker contract metadata is not recognized")

          if "prompt-missing-queue-line" in patched or "prompt-missing-worker-line" in patched:
              raise SystemExit("legacy prompt validator remains after surgical patch")
          ast.parse(patched)

          stage=root/f".server.py.zssh-push-fix.{os.getpid()}"
          stage.write_text(patched,encoding="utf-8")
          os.chmod(stage,0o644)
          os.replace(stage,live_path)

          src=candidate/"public/zcloud-worker.user.js"
          text=src.read_text(encoding="utf-8")
          if "// @version      1.3.4" not in text:
              raise SystemExit("userscript not 1.3.4")
          dst=root/"public/zcloud-worker.user.js"
          tmp=dst.with_name(dst.name+f".zssh-push-fix.{os.getpid()}")
          shutil.copy2(src,tmp)
          os.chmod(tmp,0o644)
          os.replace(tmp,dst)
          print("SURGICAL_PROMPT_OBLIGATION_REMOVED=1")
          PY

          python3 -m py_compile "$root/server.py"
          if ! sudo -n systemctl restart zennay-cloud.service; then
            install -m 0644 "$backup/server.py" "$root/server.py"
            install -m 0644 "$backup/zcloud-worker.user.js" "$root/public/zcloud-worker.user.js"
            sudo -n systemctl restart zennay-cloud.service || true
            exit 1
          fi
          for _ in $(seq 1 30); do
            if systemctl is-active --quiet zennay-cloud.service && curl -fsS --max-time 4 http://127.0.0.1:8765/ >/dev/null; then
              echo "ZCLOUD_BACKEND_GREEN=1"
              exit 0
            fi
            sleep 1
          done
          install -m 0644 "$backup/server.py" "$root/server.py"
          install -m 0644 "$backup/zcloud-worker.user.js" "$root/public/zcloud-worker.user.js"
          sudo -n systemctl restart zennay-cloud.service || true
          exit 1

      - name: Verify live contract and served userscript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path

          with urllib.request.urlopen("http://127.0.0.1:8765/api/worker-debug",timeout=8) as r:
              debug=json.load(r)
          with urllib.request.urlopen("http://127.0.0.1:8765/zcloud-worker.user.js",timeout=8) as r:
              served=r.read()

          contract=debug.get("contract") or {}
          if contract.get("text_boilerplate_required") is not False:
              raise SystemExit(f"boilerplate still required: {contract!r}")
          for row in debug.get("workers") or []:
              failures=row.get("contract_failures") or []
              if "prompt-missing-queue-line" in failures or "prompt-missing-worker-line" in failures:
                  raise SystemExit(f"legacy failure remains for {row.get('worker')}: {failures}")

          text=served.decode("utf-8","replace")
          if "// @version      1.3.4" not in text:
              raise SystemExit("served userscript is not 1.3.4")
          if "prompt-missing-queue-line" in text or "prompt-missing-worker-line" in text:
              raise SystemExit("served userscript still contains legacy validator")
          print("LIVE_PROMPT_CONTRACT_GREEN=1")
          print("SERVED_USERSCRIPT_SHA256="+hashlib.sha256(served).hexdigest())
          PY

      - name: Recycle Firefox and push one canary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sqlite3,time,urllib.request
          from datetime import datetime,timezone

          base="http://127.0.0.1:8765"
          db="/home/ubuntu/zennay-cloud/history.db"

          def call(method,path,payload=None,timeout=45):
              body=None
              headers={"Content-Type":"application/json"}
              if payload is not None:
                  body=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)

          recycled=call("POST","/api/runner-control",{"action":"restart_firefox"})
          if not recycled.get("ok"):
              raise SystemExit("Firefox recycle failed: "+json.dumps(recycled,sort_keys=True))
          print("FIREFOX_RECYCLE_GREEN=1")
          time.sleep(12)

          targets=(call("GET","/api/runner-targets",timeout=10).get("projects") or {})
          preferred="cloud::w1"
          if targets.get(preferred,{}).get("active") is True and targets.get(preferred,{}).get("assignment_ready") is True:
              worker=preferred
          else:
              worker=next((k for k,v in targets.items() if v.get("active") is True and v.get("assignment_ready") is True and not v.get("reviewer_mode")),None)
          if not worker:
              raise SystemExit("no active assignment-ready worker")

          started=datetime.now(timezone.utc).isoformat()
          pushed=call("POST","/api/runner-control",{"project_id":worker,"action":"push"},timeout=15)
          command_id=int(pushed.get("command_id") or 0)
          if command_id<1:
              raise SystemExit("push did not queue command: "+json.dumps(pushed,sort_keys=True))
          print(f"CANARY_WORKER={worker}")
          print(f"CANARY_COMMAND_ID={command_id}")

          base_project=worker.split("::w",1)[0]
          slot=int(worker.split("::w",1)[1])
          deadline=time.time()+100
          last={}
          while time.time()<deadline:
              with sqlite3.connect(db,timeout=5) as con:
                  con.row_factory=sqlite3.Row
                  cmd=con.execute("SELECT id,status,result,updated_at FROM runner_commands WHERE id=?",(command_id,)).fetchone()
                  event=con.execute(
                      "SELECT ts,event,reason,error FROM runner_events WHERE project_id=? AND worker_slot=? AND ts>=? ORDER BY id DESC LIMIT 1",
                      (base_project,slot,started)
                  ).fetchone()
              last={"command":dict(cmd) if cmd else None,"event":dict(event) if event else None}
              if event and event["event"]=="send-blocked":
                  reason=str(event["reason"] or "")
                  if "prompt-missing-queue-line" in reason or "prompt-missing-worker-line" in reason:
                      raise SystemExit("LEGACY_CONTRACT_STILL_ACTIVE "+json.dumps(last,sort_keys=True))
              if cmd and cmd["status"]=="failed":
                  raise SystemExit("CANARY_PUSH_FAILED "+json.dumps(last,sort_keys=True))
              if event and event["event"] in {"prompt-sent","generation-started","generation-finished"}:
                  print("CANARY_PUSH_GREEN=1")
                  print(json.dumps(last,sort_keys=True))
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit("CANARY_PUSH_TIMEOUT "+json.dumps(last,sort_keys=True))
          PY
