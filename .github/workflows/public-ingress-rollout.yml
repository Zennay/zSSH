name: zSSH public gateway and Caddy rollout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE_ZSSH_PUBLIC_INGRESS to permit the VPS deployment
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: zssh-public-ingress-rollout
  cancel-in-progress: false

jobs:
  provenance:
    name: Require exact canonical protected main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Require explicit rollout confirmation
        shell: bash
        env:
          ZSSH_INGRESS_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ZSSH_INGRESS_CONFIRMATION" = "PROMOTE_ZSSH_PUBLIC_INGRESS"
      - name: Require merged-PR provenance and protected exact main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
          node scripts/check-main-protection.mjs --require-negative-proof

  rollout:
    name: Promote isolated public gateway and Caddy ingress
    needs: provenance
    runs-on:
      - self-hosted
      - haxlab
    timeout-minutes: 30
    environment: openai-production
    env:
      ZSSH_PUBLIC_BASE_URL: https://zssh.cheapgpt.shop
      ZSSH_PUBLIC_GATEWAY_PORT: "8789"
      ZSSH_OAUTH_ISSUER: ${{ vars.ZSSH_OAUTH_ISSUER }}
      ZSSH_EXPECTED_SHA: ${{ github.sha }}
      ZSSH_REVIEW_ROOT: /srv/zssh-review
      ZSSH_REVIEW_TRUST_FILE: ${{ vars.ZSSH_AGENT_PUBLIC_KEYS_FILE || '~/.config/zssh/reviewer-agent-public.json' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Re-check exact current protected main immediately before VPS mutation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Require exact production DNS convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { resolve4 } from "node:dns/promises";
          const expected = "198.244.191.182";
          const answers = [...new Set(await resolve4("zssh.cheapgpt.shop"))].sort();
          if (answers.length !== 1 || answers[0] !== expected) {
            throw new Error(`zssh.cheapgpt.shop must resolve only to ${expected}; got ${answers.join(", ") || "none"}`);
          }
          console.log(`ZSSH_PUBLIC_DNS_GREEN ipv4=${expected}`);
          NODE
      - name: Resolve reviewer target and OAuth runtime inputs
        id: rollout_inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ZSSH_OAUTH_ISSUER"
          test -d "$ZSSH_REVIEW_ROOT"
          TRUST_FILE="$ZSSH_REVIEW_TRUST_FILE"
          case "$TRUST_FILE" in
            "~/"*) TRUST_FILE="$HOME/${TRUST_FILE#~/}" ;;
          esac
          test -f "$TRUST_FILE"
          TARGET_ID="$(node --input-type=module - "$TRUST_FILE" <<'NODE'
          import { readFileSync } from "node:fs";
          const file = process.argv[2];
          const parsed = JSON.parse(readFileSync(file, "utf8"));
          const ids = Object.keys(parsed?.targets || {});
          if (parsed?.version !== 1 || ids.length !== 1 || !/^zt_[A-Za-z0-9_-]{8,}$/.test(ids[0])) {
            throw new Error("reviewer trust file must contain exactly one opaque zSSH target");
          }
          process.stdout.write(ids[0]);
          NODE
          )"
          JWKS_URI="$(node -e 'const u = new URL(process.argv[1]); if (u.protocol !== "https:") throw new Error("issuer must be HTTPS"); process.stdout.write(new URL("/.well-known/jwks.json", u.origin).href)' "$ZSSH_OAUTH_ISSUER")"
          echo "target_id=$TARGET_ID" >> "$GITHUB_OUTPUT"
          echo "trust_file=$TRUST_FILE" >> "$GITHUB_OUTPUT"
          echo "jwks_uri=$JWKS_URI" >> "$GITHUB_OUTPUT"
      - name: Validate public gateway install without mutation
        shell: bash
        env:
          ZSSH_PUBLIC_GATEWAY_VALIDATE_ONLY: "1"
          ZSSH_OAUTH_JWKS_URI: ${{ steps.rollout_inputs.outputs.jwks_uri }}
          ZSSH_TARGET_ID: ${{ steps.rollout_inputs.outputs.target_id }}
          ZSSH_AGENT_PUBLIC_KEYS_FILE: ${{ steps.rollout_inputs.outputs.trust_file }}
          ZSSH_PUBLIC_ALLOWED_ROOTS: /srv/zssh-review
        run: |
          set -Eeuo pipefail
          bash deploy/install-public-gateway.sh
      - name: Validate Caddy promotion without mutation
        shell: bash
        env:
          ZSSH_CADDY_VALIDATE_ONLY: "1"
        run: |
          set -Eeuo pipefail
          bash deploy/install-public-caddy.sh
      - name: Promote isolated public gateway
        shell: bash
        env:
          ZSSH_OAUTH_JWKS_URI: ${{ steps.rollout_inputs.outputs.jwks_uri }}
          ZSSH_TARGET_ID: ${{ steps.rollout_inputs.outputs.target_id }}
          ZSSH_AGENT_PUBLIC_KEYS_FILE: ${{ steps.rollout_inputs.outputs.trust_file }}
          ZSSH_PUBLIC_ALLOWED_ROOTS: /srv/zssh-review
          OPENAI_APPS_CHALLENGE_TOKEN: ${{ secrets.OPENAI_APPS_CHALLENGE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash deploy/install-public-gateway.sh
      - name: Promote transactional Caddy ingress
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deploy/install-public-caddy.sh
      - name: Verify local post-promotion health
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl --user is-active --quiet zssh-public.service
          sudo -n systemctl is-active --quiet caddy
          curl --fail --silent --show-error "http://127.0.0.1:$ZSSH_PUBLIC_GATEWAY_PORT/health" >/dev/null
          echo "ZSSH_PUBLIC_INGRESS_ROLLOUT_GREEN sha=$GITHUB_SHA"
