name: zSSH main protection

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROTECT_ZSSH_MAIN to apply canonical main protection
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: Require canonical merged-PR provenance
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require canonical main ref
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Bind merged PR event to canonical main SHA
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGED_PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -Eeuo pipefail
          test -n "$MERGED_PR_SHA"
          test "$GITHUB_SHA" = "$MERGED_PR_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify canonical main provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-main-provenance.mjs

  status:
    name: Check current main protection
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protected: ${{ steps.protection.outputs.protected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Read live main protection status
        id: protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS="$(node scripts/check-main-protection.mjs --public-status)"
          echo "$STATUS"
          JSON="${STATUS#ZSSH_MAIN_PROTECTION_STATUS }"
          node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write("protected=" + String(r.protected === true) + "\n")' "$JSON" >> "$GITHUB_OUTPUT"

  protect:
    name: Apply and verify main protection when needed
    needs:
      - provenance
      - status
    if: github.event_name == 'workflow_dispatch' || needs.status.outputs.protected != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: repository-governance
    env:
      ZSSH_REPO_ADMIN_TOKEN: ${{ secrets.ZSSH_REPO_ADMIN_TOKEN }}
      ZSSH_MAIN_PROTECTION_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'PROTECT_ZSSH_MAIN' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Apply canonical main protection
        shell: bash
        env:
          RECEIPT_PATH: ${{ runner.temp }}/zssh-main-protection.json
        run: |
          set -Eeuo pipefail
          node scripts/apply-main-protection.mjs --apply | tee "$RECEIPT_PATH"
      - name: Upload non-secret main-protection receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zssh-main-protection-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-main-protection.json
          if-no-files-found: error
          retention-days: 30
