name: FTMO PR481 deploy publication exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr481-deploy-publication-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr481-deploy-publication-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      TARGET_PR: "481"
      TARGET_SHA: 1c2e54dfc85d80f3b9ba2b9f9e729af4977ed79d
      EXPECTED_MAIN_SHA: 351606ca80900b9778567b89075b14d19275e74c
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Prove exact FTMO deploy-publication head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main=subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main","--jq",".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          print("FTMO_PR481_IDENTITY=verified")
          PY

          src="$RUNNER_TEMP/ftmo-pr481-zssh-$GITHUB_RUN_ID"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" fetch --no-tags origin "$TARGET_SHA"
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

          venv="$RUNNER_TEMP/ftmo-pr481-zssh-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/deploy_publish.py
          "$venv/bin/python" -m pytest -q \
            tests/test_deploy_publish_integrity.py \
            tests/test_autonomous_deploy_lockstep.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR481_DEPLOY_PUBLICATION_PROOF=success"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ftmo-pr481-proof-$GITHUB_RUN_ID.json"
          python3 - <<'PY' > "$receipt"
          import json, os
          print(json.dumps({
              "schema_version":1,
              "project":"ftmo",
              "pull_request":481,
              "target_sha":os.environ["TARGET_SHA"],
              "base_sha":os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner":os.environ.get("RUNNER_NAME",""),
              "host":"vps-bb300bba",
              "result":"success",
              "paid_cloud_budget_usd":"0.00",
              "research_outcomes_accessed":False,
              "walk_forward_accessed":False,
              "final_holdout_accessed":False,
              "live_or_broker_access_opened":False,
              "proof":[
                  "exact-pr-head",
                  "exact-main-base",
                  "descriptor-bound-deploy-parent",
                  "no-follow-deploy-ancestry",
                  "exclusive-random-deploy-temp",
                  "deploy-file-and-directory-fsync",
                  "safe-deployment-markers",
                  "canonical-deploy-lockstep-regression",
                  "zero-cost-boundary"
              ]
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          dest="runtime-evidence/ftmo-pr481-deploy-publication-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$dest" \
            -f message="Record FTMO PR481 exact-head proof $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null
          echo "FTMO_PR481_PROOF_RECEIPT=$dest"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr481-zssh-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr481-zssh-venv-$GITHUB_RUN_ID"
