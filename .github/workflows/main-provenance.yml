name: Canonical main provenance

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-main-provenance
  cancel-in-progress: false

jobs:
  verify:
    name: Require merged-PR provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Verify current main commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR #97 is the trusted quarantine-recovery boundary after accidental direct commit 25f1d284.
          ZSSH_PROVENANCE_BASE_SHA: 121411d24e288c2512d4851e973a0af80aa99733
        run: node scripts/check-main-provenance.mjs
