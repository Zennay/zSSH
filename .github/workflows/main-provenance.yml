name: Canonical main provenance

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-main-provenance
  cancel-in-progress: false

jobs:
  verify:
    name: Require merged-PR provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Verify current main commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR #97 is the trusted quarantine-recovery boundary after accidental direct commit 25f1d284.
          ZSSH_PROVENANCE_BASE_SHA: 121411d24e288c2512d4851e973a0af80aa99733
        run: node scripts/check-main-provenance.mjs
