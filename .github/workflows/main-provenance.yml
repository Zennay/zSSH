name: Canonical main provenance

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-main-provenance
  cancel-in-progress: false

jobs:
  verify:
    name: Require merged-PR provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify current main commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZSSH_PROVENANCE_BASE_SHA: 15990579bd3bcc2ecf3b41849892247039585db6
        run: node scripts/check-main-provenance.mjs
