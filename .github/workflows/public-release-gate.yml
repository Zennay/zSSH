name: OpenAI public release gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-release-gate.yml"
      - ".github/workflows/public-ingress-preflight.yml"
      - ".github/workflows/public-dns-publish.yml"
      - ".github/workflows/auth0-production-preflight.yml"
      - ".github/workflows/openai-production-readiness.yml"
      - ".github/openai-production-probe-trigger"
      - "release-contract.mjs"
      - "server.mjs"
      - "rate-limit.mjs"
      - "test/rate-limit.test.mjs"
      - "deploy/install-public-gateway.sh"
      - "test/public-gateway-installer.test.mjs"
      - "deploy/install-public-caddy.sh"
      - "test/public-caddy-installer.test.mjs"
      - "annotation-justifications.mjs"
      - "test/annotation-justifications.test.mjs"
      - "docs/openai-annotation-justifications.md"
      - "public-site.mjs"
      - "test/public-site.test.mjs"
      - "scripts/check-public-release-config.mjs"
      - "scripts/check-auth0-production.mjs"
      - "scripts/check-production-readiness-audit.mjs"
      - "scripts/check-domain-verification-binding.mjs"
      - "scripts/check-host-surface-review-binding.mjs"
      - "scripts/check-tool-scan-binding.mjs"
      - "scripts/check-main-provenance.mjs"
      - "scripts/check-public-ingress.mjs"
      - "scripts/publish-cloudflare-dns.mjs"
      - "scripts/render-public-caddy.mjs"
      - "scripts/build-openai-plugin.py"
      - "package.json"
      - "production-submission-probe.mjs"
      - "production-submission-probe-canary.mjs"
      - "test/release-contract.test.mjs"
      - "test/auth0-production-readiness.test.mjs"
      - "test/production-readiness-audit.test.mjs"
      - "test/domain-verification-binding.test.mjs"
      - "test/host-surface-review-binding.test.mjs"
      - "test/tool-scan-binding.test.mjs"
      - "test/main-provenance.test.mjs"
      - "test/public-caddy-renderer.test.mjs"
      - "test/public-ingress-preflight.test.mjs"
      - "test/cloudflare-dns-publish.test.mjs"
      - "test/release-workflow-trigger.test.mjs"
      - "submission/**"
      - "docs/openai-plugin-*.md"
      - "docs/research/cloudflare-dns-publication-2026-10-04.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-release-gate.yml"
      - ".github/workflows/public-ingress-preflight.yml"
      - ".github/workflows/public-dns-publish.yml"
      - ".github/workflows/auth0-production-preflight.yml"
      - ".github/workflows/openai-production-readiness.yml"
      - ".github/openai-production-probe-trigger"
      - "release-contract.mjs"
      - "server.mjs"
      - "rate-limit.mjs"
      - "test/rate-limit.test.mjs"
      - "deploy/install-public-gateway.sh"
      - "test/public-gateway-installer.test.mjs"
      - "deploy/install-public-caddy.sh"
      - "test/public-caddy-installer.test.mjs"
      - "annotation-justifications.mjs"
      - "test/annotation-justifications.test.mjs"
      - "docs/openai-annotation-justifications.md"
      - "public-site.mjs"
      - "test/public-site.test.mjs"
      - "scripts/check-public-release-config.mjs"
      - "scripts/check-auth0-production.mjs"
      - "scripts/check-production-readiness-audit.mjs"
      - "scripts/check-domain-verification-binding.mjs"
      - "scripts/check-host-surface-review-binding.mjs"
      - "scripts/check-tool-scan-binding.mjs"
      - "scripts/check-main-provenance.mjs"
      - "scripts/check-public-ingress.mjs"
      - "scripts/publish-cloudflare-dns.mjs"
      - "scripts/render-public-caddy.mjs"
      - "scripts/build-openai-plugin.py"
      - "package.json"
      - "production-submission-probe.mjs"
      - "production-submission-probe-canary.mjs"
      - "test/release-contract.test.mjs"
      - "test/auth0-production-readiness.test.mjs"
      - "test/production-readiness-audit.test.mjs"
      - "test/domain-verification-binding.test.mjs"
      - "test/host-surface-review-binding.test.mjs"
      - "test/tool-scan-binding.test.mjs"
      - "test/main-provenance.test.mjs"
      - "test/public-caddy-renderer.test.mjs"
      - "test/public-ingress-preflight.test.mjs"
      - "test/cloudflare-dns-publish.test.mjs"
      - "test/release-workflow-trigger.test.mjs"
      - "submission/**"
      - "docs/openai-plugin-*.md"
      - "docs/research/cloudflare-dns-publication-2026-10-04.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-openai-public-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Release gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test release configuration guard
        run: node scripts/check-public-release-config.mjs --self-test
      - name: Exercise release and portal binding contracts
        run: node --test test/release-contract.test.mjs test/auth0-production-readiness.test.mjs test/production-readiness-audit.test.mjs test/domain-verification-binding.test.mjs test/host-surface-review-binding.test.mjs test/tool-scan-binding.test.mjs test/annotation-justifications.test.mjs test/public-caddy-renderer.test.mjs test/public-caddy-installer.test.mjs test/public-ingress-preflight.test.mjs test/cloudflare-dns-publish.test.mjs test/release-workflow-trigger.test.mjs
      - name: Validate release scripts
        run: |
          node --check release-contract.mjs
          node --check annotation-justifications.mjs
          node --check scripts/check-public-release-config.mjs
          node --check scripts/check-auth0-production.mjs
          node --check scripts/check-production-readiness-audit.mjs
          node --check scripts/check-domain-verification-binding.mjs
          node --check scripts/check-host-surface-review-binding.mjs
          node --check scripts/check-tool-scan-binding.mjs
          node --check scripts/check-main-provenance.mjs
          node --check scripts/check-public-ingress.mjs
          node --check scripts/publish-cloudflare-dns.mjs
          node --check scripts/render-public-caddy.mjs
          bash -n deploy/install-public-caddy.sh
          node --check production-submission-probe.mjs
          node --check production-submission-probe-canary.mjs
          python3 -m py_compile scripts/build-openai-plugin.py


  provenance:
    name: Canonical main provenance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require current main SHA to originate from a merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR #97 is the trusted quarantine-recovery boundary after accidental direct commit 25f1d284.
          ZSSH_PROVENANCE_BASE_SHA: 121411d24e288c2512d4851e973a0af80aa99733
        run: node scripts/check-main-provenance.mjs

  production:
    name: Production submission probe
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openai-production
    env:
      ZSSH_PLUGIN_MCP_URL: ${{ vars.ZSSH_PLUGIN_MCP_URL }}
      ZSSH_REVIEW_FILE: ${{ vars.ZSSH_REVIEW_FILE }}
      ZSSH_PLUGIN_DEMO_RECORDING_URL: ${{ vars.ZSSH_PLUGIN_DEMO_RECORDING_URL }}
      ZSSH_REVIEW_WRITE_FILE: ${{ vars.ZSSH_REVIEW_WRITE_FILE }}
      ZSSH_REVIEW_ACCESS_TOKEN: ${{ secrets.ZSSH_REVIEW_ACCESS_TOKEN }}
      ZSSH_REVIEW_LOGIN_URL: ${{ vars.ZSSH_REVIEW_LOGIN_URL }}
      ZSSH_REVIEW_LOGIN_VERIFIED_URL: ${{ vars.ZSSH_REVIEW_LOGIN_VERIFIED_URL }}
      ZSSH_REVIEW_CREDENTIALS_VERIFIED: ${{ vars.ZSSH_REVIEW_CREDENTIALS_VERIFIED }}
      ZSSH_MAIN_PROTECTION_VERIFIED: ${{ vars.ZSSH_MAIN_PROTECTION_VERIFIED }}
      ZSSH_CHATGPT_DESKTOP_REVIEWED: ${{ vars.ZSSH_CHATGPT_DESKTOP_REVIEWED }}
      ZSSH_CHATGPT_MOBILE_REVIEWED: ${{ vars.ZSSH_CHATGPT_MOBILE_REVIEWED }}
      ZSSH_CHATGPT_REVIEW_SHA256: ${{ vars.ZSSH_CHATGPT_REVIEW_SHA256 }}
      ZSSH_OPENAI_DOMAIN_VERIFIED: ${{ vars.ZSSH_OPENAI_DOMAIN_VERIFIED }}
      ZSSH_OPENAI_VERIFIED_MCP_ORIGIN: ${{ vars.ZSSH_OPENAI_VERIFIED_MCP_ORIGIN }}
      ZSSH_OPENAI_TOOL_SCAN_VERIFIED: ${{ vars.ZSSH_OPENAI_TOOL_SCAN_VERIFIED }}
      ZSSH_OPENAI_TOOL_SCAN_SHA256: ${{ vars.ZSSH_OPENAI_TOOL_SCAN_SHA256 }}
      ZSSH_OAUTH_ISSUER: ${{ vars.ZSSH_OAUTH_ISSUER }}
      AUTH0_MANAGEMENT_BASE_URL: ${{ vars.AUTH0_MANAGEMENT_BASE_URL }}
      AUTH0_MANAGEMENT_API_TOKEN: ${{ secrets.AUTH0_MANAGEMENT_API_TOKEN }}
      OPENAI_APPS_CHALLENGE_TOKEN: ${{ secrets.OPENAI_APPS_CHALLENGE_TOKEN }}
      ZSSH_REQUIRE_OUTBOUND_AGENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install production probe dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Record secret-safe release configuration presence
        env:
          PREFLIGHT_EVIDENCE_PATH: ${{ runner.temp }}/zssh-openai-preflight.json
        run: node scripts/check-public-release-config.mjs --presence-json > "$PREFLIGHT_EVIDENCE_PATH"
      - name: Fail closed on incomplete or non-public release configuration
        run: node scripts/check-public-release-config.mjs
      - name: Prove Auth0 production tenant, API and DCR grant
        shell: bash
        env:
          AUTH0_REPORT_PATH: ${{ runner.temp }}/zssh-auth0-production-readiness.json
        run: |
          set -Eeuo pipefail
          node scripts/check-auth0-production.mjs | tee "$AUTH0_REPORT_PATH"
      - name: Prove external production ingress
        shell: bash
        env:
          INGRESS_REPORT_PATH: ${{ runner.temp }}/zssh-public-ingress-preflight.json
        run: |
          set -Eeuo pipefail
          node scripts/check-public-ingress.mjs "$ZSSH_PLUGIN_MCP_URL" | tee "$INGRESS_REPORT_PATH"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zssh-openai-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-openai-preflight.json
            ${{ runner.temp }}/zssh-auth0-production-readiness.json
            ${{ runner.temp }}/zssh-public-ingress-preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Bind Verify Domain evidence to exact production origin
        run: node scripts/check-domain-verification-binding.mjs
      - name: Build exact OpenAI submission bundle
        shell: bash
        env:
          BUNDLE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-bundle.json
        run: |
          set -Eeuo pipefail
          python3 scripts/build-openai-plugin.py \
            --mcp-url "$ZSSH_PLUGIN_MCP_URL" \
            --demo-url "$ZSSH_PLUGIN_DEMO_RECORDING_URL" \
            | tee "$BUNDLE_REPORT_PATH"
      - name: Run end-to-end OpenAI submission probe
        shell: bash
        env:
          PROBE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-production-probe.json
          BUNDLE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-bundle.json
        run: |
          set -Eeuo pipefail
          node production-submission-probe.mjs | tee "$PROBE_REPORT_PATH"
      - name: Bind portal Scan Tools evidence to exact live contract
        env:
          PROBE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-production-probe.json
        run: node scripts/check-tool-scan-binding.mjs
      - name: Record non-secret release evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-openai-release-evidence.json
          PROBE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-production-probe.json
          BUNDLE_REPORT_PATH: ${{ runner.temp }}/zssh-openai-bundle.json
          AUTH0_REPORT_PATH: ${{ runner.temp }}/zssh-auth0-production-readiness.json
          INGRESS_REPORT_PATH: ${{ runner.temp }}/zssh-public-ingress-preflight.json
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { assertHostSurfaceReviewBinding } from "./scripts/check-host-surface-review-binding.mjs";
          const endpoint = new URL(process.env.ZSSH_PLUGIN_MCP_URL);
          const reviewLogin = new URL(process.env.ZSSH_REVIEW_LOGIN_URL);
          if (new URL(process.env.ZSSH_REVIEW_LOGIN_VERIFIED_URL).href !== reviewLogin.href) {
            throw new Error("reviewer login verification is stale: verified login URL does not match the exact current review login URL");
          }
          const probe = JSON.parse(readFileSync(process.env.PROBE_REPORT_PATH, "utf8"));
          const bundle = JSON.parse(readFileSync(process.env.BUNDLE_REPORT_PATH, "utf8"));
          const auth0 = JSON.parse(readFileSync(process.env.AUTH0_REPORT_PATH, "utf8"));
          const ingress = JSON.parse(readFileSync(process.env.INGRESS_REPORT_PATH, "utf8"));
          if (
            ingress.ok !== true ||
            ingress.mcp_url !== endpoint.href ||
            ingress.endpoint_origin !== endpoint.origin ||
            ingress.https_health_validated !== true ||
            ingress.unauthenticated_mcp_401_validated !== true ||
            ingress.protected_resource_metadata_validated !== true
          ) {
            throw new Error("external production ingress evidence is not green for the exact submitted MCP URL");
          }
          if (auth0.ok !== true || auth0.provider !== "auth0") {
            throw new Error("Auth0 production readiness evidence is not green");
          }
          if (auth0.tenant?.dcr_enabled !== true || auth0.tenant?.dcr_security_mode !== "strict" || auth0.tenant?.resource_parameter_profile !== "compatibility") {
            throw new Error("Auth0 production tenant settings are not release-safe");
          }
          if (auth0.default_user_grant?.subject_type !== "user" || JSON.stringify(auth0.default_user_grant?.scopes) !== JSON.stringify(["zssh:read", "zssh:write"])) {
            throw new Error("Auth0 default third-party user grant is not least-privilege zSSH read/write");
          }
          if (!/^[a-f0-9]{64}$/.test(String(probe.tool_scan_sha256 || ""))) {
            throw new Error("production probe did not emit a valid tool scan fingerprint");
          }
          if (process.env.ZSSH_OPENAI_TOOL_SCAN_SHA256 !== probe.tool_scan_sha256) {
            throw new Error("OpenAI portal Scan Tools attestation is stale: configured fingerprint does not match the exact live production tool contract");
          }
          const hostSurface = assertHostSurfaceReviewBinding(
            process.env.ZSSH_PLUGIN_MCP_URL,
            probe.tool_scan_sha256,
            process.env.ZSSH_CHATGPT_REVIEW_SHA256
          );
          if (probe.annotation_justifications_validated !== true || !/^[a-f0-9]{64}$/.test(String(probe.annotation_justifications_sha256 || ""))) {
            throw new Error("production probe did not bind reviewer annotation justifications to the exact live tool scan");
          }
          if (probe.oauth_authorization_server_metadata_validated !== true || probe.oauth_pkce_s256_validated !== true || probe.oauth_client_registration_validated !== true) {
            throw new Error("production probe did not prove OAuth authorization-server metadata + PKCE S256 + client registration");
          }
          if (probe.outbound_agent_transport_validated !== true) {
            throw new Error("production probe did not prove outbound-agent transport");
          }
          if (probe.demo_recording_accessible !== true) {
            throw new Error("production probe did not prove reviewer-accessible demo recording");
          }
          if (probe.listing_urls_validated !== true) {
            throw new Error("production probe did not prove same-origin public listing pages");
          }
          if (process.env.ZSSH_MAIN_PROTECTION_VERIFIED !== "1") {
            throw new Error("main branch protection has not been attested after a controlled rejected-direct-push proof");
          }
          if (process.env.ZSSH_CHATGPT_DESKTOP_REVIEWED !== "1") {
            throw new Error("production connection card has not been attested green in ChatGPT desktop");
          }
          if (process.env.ZSSH_CHATGPT_MOBILE_REVIEWED !== "1") {
            throw new Error("production connection card has not been attested green in ChatGPT mobile");
          }
          if (process.env.ZSSH_OPENAI_DOMAIN_VERIFIED !== "1") {
            throw new Error("OpenAI portal domain verification is not attested green");
          }
          if (process.env.ZSSH_OPENAI_TOOL_SCAN_VERIFIED !== "1") {
            throw new Error("OpenAI portal tool scan is not attested current and green");
          }
          if (!/^[a-f0-9]{64}$/.test(String(bundle.zip_sha256 || ""))) {
            throw new Error("submission bundle did not emit a valid SHA-256");
          }
          if (bundle.version !== "0.1.2") {
            throw new Error("submission bundle version is not 0.1.2");
          }
          const evidence = {
            ok: true,
            repository: process.env.GITHUB_REPOSITORY,
            commit_sha: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            endpoint_origin: endpoint.origin,
            endpoint_path: endpoint.pathname,
            public_ingress_validated: true,
            public_ingress_dns_address_count: ingress.dns_address_count,
            public_ingress_dns_families: ingress.dns_families,
            review_login_origin: reviewLogin.origin,
            review_login_path: reviewLogin.pathname,
            review_login_verified_url: process.env.ZSSH_REVIEW_LOGIN_VERIFIED_URL,
            reviewer_credentials_verified: process.env.ZSSH_REVIEW_CREDENTIALS_VERIFIED === "1",
            main_protection_verified: true,
            chatgpt_desktop_reviewed: true,
            chatgpt_mobile_reviewed: true,
            chatgpt_review_sha256: hostSurface.chatgpt_review_sha256,
            connection_card_sha256: hostSurface.connection_card_sha256,
            openai_domain_verified: true,
            verified_mcp_origin: process.env.ZSSH_OPENAI_VERIFIED_MCP_ORIGIN,
            openai_tool_scan_verified: true,
            openai_tool_scan_sha256: process.env.ZSSH_OPENAI_TOOL_SCAN_SHA256,
            tool_scan_sha256: probe.tool_scan_sha256,
            annotation_justifications_validated: true,
            annotation_justifications_sha256: probe.annotation_justifications_sha256,
            plugin_version: bundle.version,
            submission_bundle_sha256: bundle.zip_sha256,
            redirect_policy: "manual-fail-closed",
            listing_urls_validated: true,
            listing_urls: bundle.listing_urls,
            resource_metadata_challenge: "exact-same-origin",
            oauth_authorization_server_metadata_validated: true,
            oauth_pkce_s256_validated: true,
            oauth_client_registration_validated: true,
            oauth_provider: "auth0",
            auth0_dcr_enabled: true,
            auth0_dcr_security_mode: auth0.tenant.dcr_security_mode,
            auth0_resource_parameter_profile: auth0.tenant.resource_parameter_profile,
            auth0_authorization_response_iss_parameter_supported: auth0.tenant.authorization_response_iss_parameter_supported,
            auth0_resource_signing_alg: auth0.resource_server.signing_alg,
            auth0_default_user_grant_scopes: auth0.default_user_grant.scopes,
            outbound_agent_transport_validated: true,
            demo_recording_accessible: true,
            demo_recording_origin: probe.demo_recording_origin,
            demo_recording_path: probe.demo_recording_path,
            demo_recording_content_type: probe.demo_recording_content_type,
            oauth_authorization_servers: probe.oauth_authorization_servers,
            verified_at: new Date().toISOString()
          };
          writeFileSync(process.env.EVIDENCE_PATH, JSON.stringify(evidence, null, 2) + "\n");
          console.log("OPENAI_PUBLIC_RELEASE_GATE_GREEN");
          NODE
      - name: Upload release bundle and evidence
        uses: actions/upload-artifact@v4
        with:
          name: zssh-openai-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-openai-release-evidence.json
            ${{ runner.temp }}/zssh-openai-preflight.json
            ${{ runner.temp }}/zssh-auth0-production-readiness.json
            ${{ runner.temp }}/zssh-public-ingress-preflight.json
            dist/zssh-openai-plugin.zip
          if-no-files-found: error
          retention-days: 30
