name: PR50 exact-head self-hosted proof

on:
  push:
    branches:
      - proof/pr50-target-pairing-vps-20261004

permissions:
  contents: read

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR50 head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: 163e5789409d5ff775b84563c9e5627ace9a2dfc
          path: zssh
      - name: Verify and test exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zssh rev-parse HEAD)" = "163e5789409d5ff775b84563c9e5627ace9a2dfc"
          cd zssh
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node agent-pairing-canary.mjs
          node --check agent-pairing-control.mjs
