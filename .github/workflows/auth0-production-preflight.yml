name: Auth0 production readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/openai-production-auth0-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-auth0-production-readiness
  cancel-in-progress: true

jobs:
  preflight:
    name: Qualify Auth0 for zSSH production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openai-production
    env:
      ZSSH_PLUGIN_MCP_URL: ${{ vars.ZSSH_PLUGIN_MCP_URL }}
      ZSSH_OAUTH_ISSUER: ${{ vars.ZSSH_OAUTH_ISSUER }}
      AUTH0_MANAGEMENT_BASE_URL: ${{ vars.AUTH0_MANAGEMENT_BASE_URL }}
      AUTH0_MANAGEMENT_API_TOKEN: ${{ secrets.AUTH0_MANAGEMENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require reviewed protected-main Auth0 activation
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(cat .github/openai-production-auth0-trigger)" = "QUALIFY_ZSSH_PRODUCTION_AUTH0"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected
      - name: Validate Auth0 tenant, API and DCR grant
        shell: bash
        env:
          AUTH0_REPORT_PATH: ${{ runner.temp }}/zssh-auth0-production-readiness.json
        run: |
          set -Eeuo pipefail
          node scripts/check-auth0-production.mjs | tee "$AUTH0_REPORT_PATH"
      - name: Upload non-secret Auth0 readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zssh-auth0-production-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-auth0-production-readiness.json
          if-no-files-found: error
          retention-days: 30
