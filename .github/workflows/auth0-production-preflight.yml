name: Auth0 production readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/openai-production-auth0-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-auth0-production-readiness
  cancel-in-progress: true

jobs:
  preflight:
    name: Qualify Auth0 for zSSH production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openai-production
    env:
      ZSSH_PLUGIN_MCP_URL: ${{ vars.ZSSH_PLUGIN_MCP_URL || 'https://zssh.cheapgpt.shop/mcp' }}
      ZSSH_OAUTH_ISSUER: ${{ vars.ZSSH_OAUTH_ISSUER }}
      AUTH0_MANAGEMENT_BASE_URL: ${{ vars.AUTH0_MANAGEMENT_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Require reviewed protected-main Auth0 activation
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mapfile -t activation_lines < .github/openai-production-auth0-trigger
          test "${activation_lines[0]:-}" = "QUALIFY_ZSSH_PRODUCTION_AUTH0"
          test "${#activation_lines[@]}" -le 2
          if [ "${#activation_lines[@]}" -eq 2 ]; then
            [[ "${activation_lines[1]}" =~ ^activation-id=[A-Za-z0-9._:-]{8,80}$ ]]
          fi
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Require canonical protected-main manual Auth0 preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Validate Auth0 tenant, API and DCR grant
        shell: bash
        env:
          AUTH0_REPORT_PATH: ${{ runner.temp }}/zssh-auth0-production-readiness.json
          AUTH0_MANAGEMENT_API_TOKEN: ${{ secrets.AUTH0_MANAGEMENT_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          node scripts/check-auth0-production.mjs | tee "$AUTH0_REPORT_PATH"
      - name: Upload non-secret Auth0 readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-auth0-production-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/zssh-auth0-production-readiness.json
          if-no-files-found: error
          retention-days: 30
