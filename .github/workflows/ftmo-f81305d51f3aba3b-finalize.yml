name: Finalize FTMO f813 queue via zSSH runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-f81305d51f3aba3b-finalize.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-f81305d51f3aba3b-finalize-zssh
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      QUEUE_ID: ftmo-f81305d51f3aba3b
      MERGE_SHA: f028eea5f0b6cd3c11ea821cdc92096facde8c8f
      PROVEN_HEAD: a156246682bd836c071b461f66009e7d620c00b4
      EXACT_PROOF_RUN: "37005946247"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify merged package and exact-head HaxLab receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import base64, json, os, subprocess
          def gh(path):
              return json.loads(subprocess.check_output(["gh","api",path], text=True))
          main_sha = gh("repos/Zennay/Ftmo/commits/main")["sha"]
          compare = gh(f"repos/Zennay/Ftmo/compare/{os.environ['MERGE_SHA']}...{main_sha}")
          if compare.get("status") not in {"ahead","identical"}:
              raise SystemExit("PR444 merge is not in current FTMO main")
          payload = gh("repos/Zennay/Haxlab/contents/runtime-evidence/ftmo-pr444-haxlab-proof-37005946247.json")
          receipt = json.loads(base64.b64decode(str(payload["content"]).replace("\n","")))
          checks = [
              receipt.get("result") == "success",
              receipt.get("target_sha") == os.environ["PROVEN_HEAD"],
              str(receipt.get("workflow_run_id")) == os.environ["EXACT_PROOF_RUN"],
              receipt.get("runner_host") == "vps-bb300bba",
              str(receipt.get("paid_cloud_budget_usd")) == "0.00",
          ]
          if not all(checks):
              raise SystemExit("PR444 exact-head receipt verification failed")
          print("FTMO_F813_PROOF_GREEN=1")
          print("FTMO_MAIN_SHA=" + main_sha)
          PY

      - name: Finish exact live SQLite assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sqlite3, sys
          from pathlib import Path
          qid = os.environ["QUEUE_ID"]
          root = Path("/home/ubuntu/zennay-cloud")
          db = root / "history.db"
          server_path = root / "server.py"
          if not db.is_file() or not server_path.is_file():
              raise SystemExit("live zCloud SQLite/server missing")
          sys.path.insert(0, str(root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          server = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(server)
          server.DB = db

          def item():
              with sqlite3.connect(db) as c:
                  c.row_factory = sqlite3.Row
                  row = c.execute(
                      "SELECT queue_id,project_id,status,priority,eligible,worker_slot,evidence,"
                      "parent_queue_id,updated_at FROM portfolio_queue WHERE queue_id=?",(qid,)
                  ).fetchone()
              return dict(row) if row else None

          before = item()
          print("QUEUE_BEFORE=" + json.dumps(before, sort_keys=True, default=str))
          if not before or before["project_id"] != "ftmo":
              raise SystemExit("queue item missing or wrong project")
          evidence = (
              "Worker5 Gen29 BI5 transfer-framing package complete: FTMO PR #444 merged "
              f"{os.environ['MERGE_SHA']} from exact head {os.environ['PROVEN_HEAD']}; "
              f"HaxLab VPS proof {os.environ['EXACT_PROOF_RUN']} SUCCESS on vps-bb300bba "
              "(isolated install, compile, Dukascopy provider, timeout/retry, autonomous provider "
              "retry, zero-cost boundary, full-suite collection). Gen29 remains provider_foundation; "
              "development, walk-forward, final holdout, live/broker and paid-cloud stay sealed."
          )
          result = None
          if before["status"] == "done" and int(before["eligible"] or 0) == 0 and before["worker_slot"] is None:
              print("QUEUE_ALREADY_DONE=1")
          elif before["status"] in {"claimed","running","verifying","in_progress"} and before["worker_slot"] is not None:
              result = server.portfolio_queue_finish(int(before["worker_slot"]), qid, "DONE", evidence)
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused assignment")
          else:
              raise SystemExit(f"nonstandard queue state {before['status']}/{before['worker_slot']}")
          after = item()
          print("QUEUE_AFTER=" + json.dumps(after, sort_keys=True, default=str))
          if not after or after["status"] != "done" or int(after["eligible"] or 0) != 0 or after["worker_slot"] is not None:
              raise SystemExit("queue readback not DONE")
          with sqlite3.connect(db) as c:
              c.row_factory = sqlite3.Row
              successors = [dict(r) for r in c.execute(
                  "SELECT queue_id,project_id,status,priority,eligible,worker_slot,parent_queue_id,"
                  "updated_at FROM portfolio_queue WHERE parent_queue_id=? ORDER BY created_at",(qid,)
              ).fetchall()]
          receipt = {
              "schema_version":1,"project":"ftmo","queue_id":qid,
              "merge_sha":os.environ["MERGE_SHA"],"proven_head":os.environ["PROVEN_HEAD"],
              "exact_proof_run":int(os.environ["EXACT_PROOF_RUN"]),
              "finalizer_workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "queue_before":before,"queue_readback":after,"finish_result":result,
              "successors":successors,"job_status":"success",
          }
          out = Path("runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2,default=str)+"\n",encoding="utf-8")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          print("QUEUE_SUCCESSORS=" + json.dumps(successors,sort_keys=True,default=str))
          PY
          git config user.name "zssh-automation"
          git config user.email "zssh-automation@users.noreply.github.com"
          git add runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO f813 queue finalizer"
            git push origin HEAD:main
          fi
