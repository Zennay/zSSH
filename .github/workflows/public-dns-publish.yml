name: zSSH production DNS publish

on:
  push:
    branches: [main]
    paths:
      - ".github/openai-production-dns-trigger"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_ZSSH_PRODUCTION_DNS to permit the DNS write
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zssh-production-dns-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish DNS-only production A record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openai-production
    env:
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: cheapgpt.shop
      ZSSH_PUBLIC_BASE_URL: https://zssh.cheapgpt.shop
      ZSSH_PUBLIC_IPV4: 198.244.191.182
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: Require reviewed protected-main DNS activation
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(cat .github/openai-production-dns-trigger)" = "PUBLISH_ZSSH_PRODUCTION_DNS"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Require canonical protected-main manual DNS dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/check-main-provenance.mjs
          node scripts/check-main-protection.mjs --public-status --require-protected --require-current-sha
      - name: Require explicit production DNS confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ZSSH_DNS_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$ZSSH_DNS_CONFIRMATION" = "PUBLISH_ZSSH_PRODUCTION_DNS"
      - name: Verify Cloudflare API token is active
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-cloudflare-token-verify.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/verify-cloudflare-token.mjs | tee "$EVIDENCE_PATH"
      - name: Validate desired Cloudflare DNS change without mutation
        id: dns_plan
        env:
          ZSSH_DNS_APPLY: "0"
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-cloudflare-dns-plan.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZSSH_DNS_EXPECTED_CURRENT_IPV4: ${{ vars.ZSSH_DNS_EXPECTED_CURRENT_IPV4 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/publish-cloudflare-dns.mjs | tee "$EVIDENCE_PATH"
          CURRENT_STATE_SHA256="$(node --input-type=module - "$EVIDENCE_PATH" <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.stdout.write(String(evidence.previous_state_sha256 || ""));
          NODE
          )"
          printf 'current_state_sha256=%s\n' "$CURRENT_STATE_SHA256" >> "$GITHUB_OUTPUT"
      - name: Publish exact DNS-only A record
        env:
          ZSSH_DNS_APPLY: "1"
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-cloudflare-dns-result.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZSSH_DNS_EXPECTED_CURRENT_IPV4: ${{ vars.ZSSH_DNS_EXPECTED_CURRENT_IPV4 }}
          ZSSH_DNS_EXPECTED_CURRENT_STATE_SHA256: ${{ steps.dns_plan.outputs.current_state_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/publish-cloudflare-dns.mjs | tee "$EVIDENCE_PATH"
      - name: Re-read Cloudflare API and prove idempotent desired state
        env:
          ZSSH_DNS_APPLY: "0"
          EVIDENCE_PATH: ${{ runner.temp }}/zssh-cloudflare-dns-verify.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZSSH_DNS_EXPECTED_CURRENT_IPV4: ${{ vars.ZSSH_DNS_EXPECTED_CURRENT_IPV4 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/publish-cloudflare-dns.mjs | tee "$EVIDENCE_PATH"
          node --input-type=module - "$EVIDENCE_PATH" <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (
            evidence.ok !== true ||
            evidence.action !== "noop" ||
            evidence.ttl !== 1 ||
            evidence.proxied !== false
          ) {
            throw new Error("Cloudflare DNS did not converge to the exact DNS-only A-record state");
          }
          console.log("ZSSH_PRODUCTION_DNS_GREEN");
          NODE
      - name: Prove public DNS convergence and expose the next live stage
        shell: bash
        env:
          ORIGIN_REPORT_PATH: ${{ runner.temp }}/zssh-public-origin-after-dns.json
        run: |
          set -Eeuo pipefail
          MCP_URL="${ZSSH_PUBLIC_BASE_URL%/}/mcp"
          for attempt in 1 2 3 4 5 6; do
            node scripts/observe-public-origin-readiness.mjs "$MCP_URL" | tee "$ORIGIN_REPORT_PATH"
            STAGE="$(node --input-type=module - "$ORIGIN_REPORT_PATH" <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.stdout.write(String(result.stage || "unknown"));
          NODE
            )"
            if [ "$STAGE" != "dns" ]; then
              echo "ZSSH_PRODUCTION_DNS_EXTERNALLY_RESOLVABLE stage=$STAGE"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "Public DNS still does not resolve after bounded convergence checks" >&2
          exit 1
      - name: Upload non-secret DNS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-cloudflare-dns-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-cloudflare-token-verify.json
            ${{ runner.temp }}/zssh-cloudflare-dns-plan.json
            ${{ runner.temp }}/zssh-cloudflare-dns-result.json
            ${{ runner.temp }}/zssh-cloudflare-dns-verify.json
            ${{ runner.temp }}/zssh-public-origin-after-dns.json
          if-no-files-found: warn
          retention-days: 30
