name: FTMO PR460 exact-head research sync trigger proof via zSSH

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr460-sync-trigger-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr460-sync-trigger-proof-zssh
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TARGET_SHA: b3629a0487f9e369e5b6f5aa9c8125487f8192c8
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr460-zssh"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr460-zssh"
          venv="$RUNNER_TEMP/ftmo-pr460-zssh-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove research sync trigger contract
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr460-zssh"
          venv="$RUNNER_TEMP/ftmo-pr460-zssh-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_zero_cost_workflow_boundary.py             tests/test_immutable_evidence.py
          echo "FTMO_PR460_ZSSH_GREEN=1"

      - name: Persist proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr460-zssh-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project":"ftmo",
              "pr":460,
              "target_sha":os.environ["TARGET_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_host":socket.gethostname(),
              "result":os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd":os.environ["FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"],
              "proof":["exact-sha-checkout","zero-cost-workflow-contracts","immutable-evidence-regressions"]
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr460-zssh-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path"             -f message="Record FTMO PR460 zSSH proof run ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
# trigger: ftmo-pr460-zssh
