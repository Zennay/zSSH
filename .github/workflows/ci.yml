name: zSSH CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run security and deployment tests
        run: npm test
      - name: Validate deployment scripts
        run: |
          bash -n deploy/install-live.sh
          bash -n deploy/bootstrap-vps.sh
          bash -n deploy/configure-tunnel.sh
          bash -n ops/diagnose-vps.sh
          bash -n ops/register-zcloud.sh
      - name: Validate server syntax
        run: node --check server.mjs
      - name: Exercise authenticated MCP file roundtrip and policy canary
        shell: bash
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_root"' EXIT
          export NODE_ENV=production
          export PORT=18788
          export ZSSH_ALLOWED_ROOTS="$test_root"
          export ZSSH_AUDIT_LOG="$test_root/audit.jsonl"
          export ZSSH_DEV_BEARER_TOKEN="$(openssl rand -hex 32)"
          node server.mjs &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null
          node live-canary.mjs
