name: zSSH CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run security and deployment tests
        run: npm test
      - name: Validate deployment scripts
        run: |
          bash -n deploy/install-live.sh
          bash -n deploy/bootstrap-vps.sh
          bash -n deploy/configure-tunnel.sh
          bash -n ops/diagnose-vps.sh
          bash -n ops/register-zcloud.sh
      - name: Validate server syntax
        run: node --check server.mjs
      - name: Exercise authenticated MCP file roundtrip and policy canary
        shell: bash
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_root"' EXIT
          export NODE_ENV=production
          export PORT=18788
          export ZSSH_ALLOWED_ROOTS="$test_root"
          export ZSSH_AUDIT_LOG="$test_root/audit.jsonl"
          export ZSSH_DEV_BEARER_TOKEN="$(openssl rand -hex 32)"
          node server.mjs &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null
          node live-canary.mjs

      - name: Exercise public plugin profile and OpenAI challenge
        shell: bash
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_root"' EXIT
          export NODE_ENV=production
          export PORT=18789
          export ZSSH_PUBLIC_ALLOWED_ROOTS="$test_root"
          export ZSSH_ALLOWED_ROOTS="$test_root"
          export ZSSH_AUDIT_LOG="$test_root/audit.jsonl"
          export ZSSH_DEV_BEARER_TOKEN="$(openssl rand -hex 32)"
          export OPENAI_APPS_CHALLENGE_TOKEN="$(openssl rand -hex 32)"
          export ZSSH_PLUGIN_PROFILE=public
          export ZSSH_PUBLIC_AUTH_MODE=legacy
          export ZSSH_ALLOW_LEGACY_PUBLIC_AUTH=1
          export ZSSH_PAIRING_REQUIRED=0
          export ZSSH_ALLOW_UNPAIRED_PUBLIC=1
          export ZSSH_EXEC_MODE=disabled
          node server.mjs &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null
          node public-plugin-canary.mjs

      - name: Exercise public OAuth discovery and HTTP challenge
        shell: bash
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_root"' EXIT
          export NODE_ENV=production
          export PORT=18790
          export ZSSH_PUBLIC_ALLOWED_ROOTS="$test_root"
          export ZSSH_ALLOWED_ROOTS="$test_root"
          export ZSSH_AUDIT_LOG="$test_root/audit.jsonl"
          export ZSSH_PLUGIN_PROFILE=public
          export ZSSH_PUBLIC_AUTH_MODE=oauth
          export ZSSH_EXEC_MODE=disabled
          export ZSSH_PUBLIC_BASE_URL="https://mcp.zssh.example"
          export ZSSH_OAUTH_ISSUER="https://auth.zssh.example"
          export ZSSH_OAUTH_JWKS_URI="https://auth.zssh.example/.well-known/jwks.json"
          export ZSSH_OAUTH_SCOPES="zssh:read zssh:write"
          node server.mjs &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$PORT/health" >/dev/null
          metadata="$(curl --fail --silent "http://127.0.0.1:$PORT/.well-known/oauth-protected-resource")"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            if (metadata.resource !== "https://mcp.zssh.example") throw new Error("wrong OAuth resource");
            if (!metadata.authorization_servers?.includes("https://auth.zssh.example")) throw new Error("missing authorization server");
            if (!metadata.scopes_supported?.includes("zssh:read") || !metadata.scopes_supported?.includes("zssh:write")) throw new Error("missing OAuth scopes");
          ' "$metadata"
          headers="$(mktemp)"
          code="$(curl --silent --output /dev/null --dump-header "$headers" --write-out "%{http_code}" -X POST "http://127.0.0.1:$PORT/mcp")"
          test "$code" = "401"
          grep -Fi 'WWW-Authenticate: Bearer ' "$headers"
          grep -F 'resource_metadata="https://mcp.zssh.example/.well-known/oauth-protected-resource"' "$headers"

      - name: Exercise OAuth target pairing and revocation
        run: node pairing-canary.mjs

      - name: Validate OpenAI submission contract canary
        run: python3 scripts/openai-submission-contract-canary.py

      - name: Validate reproducible OpenAI submission bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          build_a="$GITHUB_WORKSPACE/dist/repro-a"
          build_b="$GITHUB_WORKSPACE/dist/repro-b"
          python3 scripts/build-openai-plugin.py \
            --mcp-url "https://mcp.review.example/mcp" \
            --demo-url "https://review.example/zssh-demo" \
            --out-dir "$build_a/openai-plugin" > "$RUNNER_TEMP/zssh-build-a.json"
          python3 scripts/build-openai-plugin.py \
            --mcp-url "https://mcp.review.example/mcp" \
            --demo-url "https://review.example/zssh-demo" \
            --out-dir "$build_b/openai-plugin" > "$RUNNER_TEMP/zssh-build-b.json"
          python3 - "$RUNNER_TEMP/zssh-build-a.json" "$RUNNER_TEMP/zssh-build-b.json" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path

          first = json.loads(Path(sys.argv[1]).read_text())
          second = json.loads(Path(sys.argv[2]).read_text())
          assert first["version"] == second["version"] == "0.1.1"
          assert first["zip_sha256"] == second["zip_sha256"]
          package = Path(first["zip"])
          assert hashlib.sha256(package.read_bytes()).hexdigest() == first["zip_sha256"]
          with zipfile.ZipFile(package) as z:
              names = set(z.namelist())
              assert {"plugin.json", "mcp.json", "assets/icon.svg"} <= names
              plugin = json.loads(z.read("plugin.json"))
              mcp = json.loads(z.read("mcp.json"))
          assert plugin["version"] == "0.1.1"
          review = plugin["extensions"]["com.openai"]["review"]["test_cases"]
          assert len(review["positive"]) == 5
          assert len(review["negative"]) == 3
          assert mcp["mcpServers"]["zssh"]["url"] == "https://mcp.review.example/mcp"
          print("OPENAI_PLUGIN_REPRODUCIBLE_BUNDLE_GREEN", first["zip_sha256"])
          PY

      - name: Validate reviewer target fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          review_root="$RUNNER_TEMP/zssh-review"
          node scripts/prepare-review-target.mjs --root "$review_root" > "$RUNNER_TEMP/review-fixture.json"
          test -f "$review_root/sample.txt"
          grep -F "status=ready" "$review_root/sample.txt"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!x.ok || x.review_root!==process.argv[2]) process.exit(1)' "$RUNNER_TEMP/review-fixture.json" "$review_root"

      - name: Exercise production submission readiness probe
        run: node production-submission-probe-canary.mjs


  pr407-stale-ci-proof:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Run guarded PR407 stale CI proof on VPS')
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Verify exact PR407 stale run scope and terminal state
        shell: bash
        env:
          EXPECTED_PR407_HEAD: 60fcbbc3562e77013f44830c4db26b69f0167ca1
          EXPECTED_PR407_MERGE: c7a83dae1cc4248e59b6a02d1ec9e0ac8b6dc56b
          PROTECTED_PR408_HEAD: 482ae9782f941e6926d73d81c76f316ffec4c081
        run: |
          set -euo pipefail
          host="$(hostname)"
          case "$host" in
            vps-bb300bba|vps-bb300bba.*) ;;
            *) echo "REFUSE unexpected host=$host" >&2; exit 1 ;;
          esac
          command -v gh >/dev/null
          gh auth status --hostname github.com >/dev/null 2>&1

          pr407="$(gh api repos/Zennay/Ftmo/pulls/407)"
          python3 - "$EXPECTED_PR407_HEAD" "$EXPECTED_PR407_MERGE" <<'PY' <<<"$pr407"
import json, sys
expected_head, expected_merge = sys.argv[1:]
d=json.load(sys.stdin)
assert d["state"] == "closed"
assert d.get("merged_at")
assert d["head"]["sha"] == expected_head
assert d.get("merge_commit_sha") == expected_merge
print("PR407_GUARD_OK", d["head"]["sha"], d["merge_commit_sha"])
PY

          pr406_head="$(gh api repos/Zennay/Ftmo/pulls/406 --jq '.head.sha')"
          test "$EXPECTED_PR407_HEAD" != "$PROTECTED_PR408_HEAD"
          test "$EXPECTED_PR407_HEAD" != "$pr406_head"

          for id in 36981941923 36981941937; do
            file="/tmp/ftmo-$id.json"
            gh api "repos/Zennay/Ftmo/actions/runs/$id" > "$file"
            python3 - "$file" "$id" "$EXPECTED_PR407_HEAD" "$PROTECTED_PR408_HEAD" "$pr406_head" <<'PY'
import json, sys
p, expected_id, expected_sha, protected408, pr406 = sys.argv[1:]
d=json.load(open(p, encoding="utf-8"))
assert str(d["id"]) == expected_id
assert d["head_sha"] == expected_sha
assert d["head_sha"] != protected408
assert d["head_sha"] != pr406
assert d["head_branch"] != "main"
assert d["event"] == "pull_request"
print(f'TARGET_GUARD_OK id={d["id"]} status={d["status"]} conclusion={d.get("conclusion")}')
PY
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$file")"
            case "$status" in
              queued|pending|in_progress)
                gh api -X POST "repos/Zennay/Ftmo/actions/runs/$id/cancel" >/dev/null
                echo "TARGET_ACTION id=$id action=requested_cancel"
                ;;
              completed)
                echo "TARGET_ACTION id=$id action=already_terminal"
                ;;
              *)
                echo "REFUSE id=$id unknown_status=$status" >&2
                exit 1
                ;;
            esac
          done

          for id in 36981941923 36981941937; do
            terminal=false
            for _ in $(seq 1 30); do
              gh api "repos/Zennay/Ftmo/actions/runs/$id" > "/tmp/final-$id.json"
              status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "/tmp/final-$id.json")"
              if [ "$status" = completed ]; then terminal=true; break; fi
              sleep 2
            done
            test "$terminal" = true
            python3 - "/tmp/final-$id.json" "$EXPECTED_PR407_HEAD" <<'PY'
import json, sys
d=json.load(open(sys.argv[1], encoding="utf-8"))
assert d["head_sha"] == sys.argv[2]
assert d["head_branch"] != "main"
assert d["status"] == "completed"
print(f'TARGET_TERMINAL id={d["id"]} status={d["status"]} conclusion={d.get("conclusion")}')
PY
          done

          for id in 36982734136 36982734283; do
            gh api "repos/Zennay/Ftmo/actions/runs/$id" > "/tmp/pr408-$id.json"
            python3 - "/tmp/pr408-$id.json" "$PROTECTED_PR408_HEAD" <<'PY'
import json, sys
d=json.load(open(sys.argv[1], encoding="utf-8"))
assert d["head_sha"] == sys.argv[2]
assert d["head_branch"] != "main"
print(f'PR408_PROTECTED id={d["id"]} status={d["status"]} conclusion={d.get("conclusion")} head={d["head_sha"]}')
PY
          done

          echo "ZSSH_PR407_STALE_CI_PROOF=GREEN runner=$host github_run_id=$GITHUB_RUN_ID"
