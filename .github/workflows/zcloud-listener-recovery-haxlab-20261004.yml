name: HaxLab fallback recover zCloud listener

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-listener-recovery-haxlab-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-zcloud-listener-recovery-haxlab-20261004
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    env:
      ZCLOUD_RUNNER_SERVICE: actions.runner.Zennay-zCloud.zcloud-vps-1.service
      PRODUCTION_RUN_ID: "37165967873"
    steps:
      - name: Safely recover only idle zCloud listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          service="$ZCLOUD_RUNNER_SERVICE"
          test "$(systemctl is-active "$service" || true)" != "unknown"

          cgroup="$(systemctl show "$service" -p ControlGroup --value || true)"
          worker=0
          if [[ -n "$cgroup" && -r "/sys/fs/cgroup${cgroup}/cgroup.procs" ]]; then
            while read -r pid; do
              [[ -r "/proc/$pid/cmdline" ]] || continue
              cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" || true)"
              if [[ "$cmd" == *"Runner.Worker"* ]]; then
                worker=1
                echo "ZCLOUD_RUNNER_ACTIVE_WORKER pid=$pid"
                break
              fi
            done < "/sys/fs/cgroup${cgroup}/cgroup.procs"
          fi

          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          echo "ZCLOUD_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker"

          if [[ "$worker" -eq 1 ]]; then
            echo "ZCLOUD_RUNNER_RECOVERY=preserve_active_worker"
            exit 0
          fi

          sudo -n systemctl reset-failed "$service" || true
          sudo -n systemctl restart "$service"

          for _ in $(seq 1 20); do
            post_state="$(systemctl is-active "$service" || true)"
            post_pid="$(systemctl show "$service" -p MainPID --value || true)"
            if [[ "$post_state" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ && -r "/proc/$post_pid/cmdline" ]]; then
              post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline" || true)"
              if [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]]; then
                echo "ZCLOUD_RUNNER_RECOVERY=restart_idle_listener"
                echo "ZCLOUD_RUNNER_POST state=$post_state pid=$post_pid"
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Verify production run leaves pending state
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            payload="$(curl -fsSL --max-time 10 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Zennay/zCloud/actions/runs/$PRODUCTION_RUN_ID")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
            conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")"
            echo "ZCLOUD_PRODUCTION_RUN run_id=$PRODUCTION_RUN_ID status=$status conclusion=$conclusion"
            if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
              exit 0
            fi
            sleep 4
          done
          exit 1
