name: FTMO PR471 exact-head future-window proof via zSSH

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr471-future-window-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr471-future-window-proof-zssh
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      TARGET_SHA: 5594b2a1d310fd967b187ae637296727bfc3a8c7
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO PR471 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr471-exact-head"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr471-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr471-exact-head-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove future-window gate and sealed provider boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr471-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr471-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/ops/autonomous_rollover.py             src/prop_trading_ai/ops/autonomous_generation_loop.py
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_provider_retry.py             tests/test_autonomous_deploy_lockstep.py             tests/test_provider_foundation_publication.py             tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR471_TARGETED_GREEN=1"

      - name: Prove complete exact-head suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr471-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr471-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q
          echo "FTMO_PR471_FULL_SUITE_GREEN=1"

      - name: Persist sanitized proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr471-zssh-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project": "ftmo",
              "pr": 471,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": os.environ["FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"],
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
              "proof": [
                  "exact-sha-checkout",
                  "future-window-no-provider-io",
                  "exact-holdout-end-boundary",
                  "marathon-future-window-backoff",
                  "deploy-sealed-provider-wait",
                  "provider-publication-regressions",
                  "zero-cost-boundaries",
                  "full-exact-head-pytest-suite"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr471-zssh-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path"             -f message="Record FTMO PR471 exact-head proof ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_PR471_RECEIPT_PATH=$path"
