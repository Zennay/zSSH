name: FTMO PR474 telemetry authority exact-head proof via zSSH

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr471-future-window-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr474-telemetry-authority-proof-zssh
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      TARGET_SHA: 11012541925842d657fd2fee574a4a6100a79efc
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO PR474 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr474-exact-head"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr474-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr474-exact-head-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove telemetry authority and sealed Gen30 state
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr474-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr474-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/cli/v1_project_telemetry.py
          "$venv/bin/python" -m pytest -q tests/test_project_telemetry.py tests/test_project_telemetry_runtime_status.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py -k "every_repository_workflow_has_no_github_hosted_runner or diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free"
          status="/opt/ftmo-autonomous/.scratch/autonomy/status.json"
          test -f "$status"
          before="$(sha256sum "$status" | awk '{print $1}')"
          "$venv/bin/python" - "$status" <<'PY'
          import sys
          from pathlib import Path
          from prop_trading_ai.cli.v1_project_telemetry import _autonomous_runtime_summary
          summary = _autonomous_runtime_summary(Path(sys.argv[1]))
          assert summary["generation_number"] >= 30
          assert summary["stage"] == "provider_foundation"
          assert summary["action"] == "provider_foundation_window_not_elapsed"
          assert summary["research_cycle_ok"] is True
          assert summary["development_access_allowed"] is False
          assert summary["walk_forward_access_allowed"] is False
          assert summary["final_holdout_access_allowed"] is False
          assert summary["live_trading_allowed"] is False
          assert summary["broker_order_submission_allowed"] is False
          print(summary)
          PY
          after="$(sha256sum "$status" | awk '{print $1}')"
          test "$before" = "$after"
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr474-collection-$GITHUB_RUN_ID.txt
          test -s /tmp/ftmo-pr474-collection-$GITHUB_RUN_ID.txt
          echo "FTMO_PR474_TARGETED_GREEN=1"

      - name: Persist sanitized proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr474-zssh-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project": "ftmo",
              "pr": 474,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": os.environ["FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"],
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
              "proof": [
                  "exact-sha-checkout",
                  "telemetry-cli-compile",
                  "runtime-authority-regressions",
                  "live-gen30-sealed-read-only",
                  "zero-cost-boundaries",
                  "full-suite-collection"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr474-zssh-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path"             -f message="Record FTMO PR474 exact-head proof ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_PR474_RECEIPT_PATH=$path"
