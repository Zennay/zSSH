name: FTMO PR473 canonical receipt proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-pr473-canonical-receipt-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TARGET_SHA: e17d084955e5b8cf49a1f057441760db3cf7afda
      FTMO_STABLE_ROOT: /opt/ftmo-autonomous
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Prove PR473 on VPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          work="$RUNNER_TEMP/ftmo-pr473-zssh-$GITHUB_RUN_ID"
          rm -rf "$work"
          gh repo clone Zennay/Ftmo "$work" -- --filter=blob:none --no-checkout >/dev/null
          cd "$work"
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          venv="$RUNNER_TEMP/ftmo-pr473-zssh-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r requirements-ci.txt
          "$venv/bin/python" -m pip install -q -e .
          "$venv/bin/python" -m pytest -q \
            tests/test_project_telemetry_cli.py \
            tests/test_project_telemetry_runtime_status.py \
            tests/test_zero_cost_workflow_boundary.py

          receipt="artifacts/autonomous_runtime/vps-controller-receipt.json"
          status="$FTMO_STABLE_ROOT/.scratch/autonomy/status.json"
          expected="$("$venv/bin/python" - "$receipt" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          assert data["source_main_sha"] == data["runtime_revision"]
          print(data["source_main_sha"])
          PY
          )"
          before="$(sha256sum "$status" | awk '{print $1}')"
          "$venv/bin/python" -m prop_trading_ai.cli.v1_project_telemetry \
            --root . \
            --config configs/research_machine.json \
            --runtime-status "$status" \
            --expected-runtime-revision "$expected" \
            --output "$RUNNER_TEMP/ftmo-pr473-zssh.json" \
            --markdown-output "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          test "$before" = "$(sha256sum "$status" | awk '{print $1}')"
          grep -F 'Live autonomous:** Generation **30**' "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          grep -F 'matches canonical deploy receipt' "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          ! grep -F 'older deployed revision' "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          grep -F 'provider_foundation_window_not_elapsed' "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          grep -F '2026-12-25T21:00:00+00:00' "$RUNNER_TEMP/ftmo-pr473-zssh.md"
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr473-zssh-collection-$GITHUB_RUN_ID.txt
          test -s /tmp/ftmo-pr473-zssh-collection-$GITHUB_RUN_ID.txt
          echo "FTMO_PR473_ZSSH_PROOF=success"

      - name: Persist receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ftmo-pr473-zssh-proof.json
          import json, os
          print(json.dumps({
              "project":"ftmo",
              "pull_request":473,
              "target_sha":os.environ["TARGET_SHA"],
              "result":"success",
              "runner_host":"vps-bb300bba",
              "runner_name":os.environ.get("RUNNER_NAME"),
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "proof":["targeted-tests","canonical-receipt-match","live-gen30-read-only-render","full-suite-collection"]
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-pr473-zssh-proof.json)"
          dest="runtime-evidence/ftmo-pr473-canonical-receipt-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$dest" \
            -f message="Record FTMO PR473 proof $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null
