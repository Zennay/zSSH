name: FTMO useful compute proof via zSSH

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-useful-compute-probe.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-useful-compute-proof-zssh
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    env:
      FTMO_ROOT: /opt/ftmo-autonomous
      REQUIRED_ATTRIBUTION_ANCESTOR: 0acfac83eff1136bdce1bfbde6e52b6905ccf1fc
    steps:
      - name: Check out proof repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reaffirm bounded allocation and capture fresh proof
        shell: bash
        run: |
          set -euo pipefail
          test -d "$FTMO_ROOT"
          test -x "$FTMO_ROOT/.venv/bin/python"
          test -f "$FTMO_ROOT/.scratch/autonomy/status.json"
          test -f "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha"
          test -f "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"

          deployed_revision="$(tr -d '\r\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha")"
          test -n "$deployed_revision"
          grep -Fq 'top_level_cgroup_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'system_slice_unclassified_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'user_slice_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'machine_slice_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'other_top_level_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          echo "FTMO_DEPLOYED_RUNTIME_REVISION=$deployed_revision"

          baseline_completed_at="$("$FTMO_ROOT/.venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json").read_text(encoding="utf-8"))
          print(status.get("completed_at_utc") or "")
          PY
          )"
          export BASELINE_COMPLETED_AT="$baseline_completed_at"

          sudo -n systemctl disable --now ftmo-autonomous.timer || true
          sudo -n systemctl set-property --runtime ftmo-autonomous-marathon.service CPUWeight=10000 CPUQuota=500%
          for unit in \
            haxlab-autonomy.service \
            haxlab-live-room.service \
            haxlab-worker.service \
            haxlab-analyzer.service \
            haxlab-ingest.service; do
            if [ "$(systemctl show "$unit" -p LoadState --value 2>/dev/null || true)" = loaded ]; then
              sudo -n systemctl set-property --runtime "$unit" CPUWeight=100 CPUQuota=100%
            fi
          done

          sudo -n systemctl enable --now ftmo-autonomous-marathon.service
          sudo -n systemctl restart ftmo-autonomous-marathon.service

          "$FTMO_ROOT/.venv/bin/python" - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          path=Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json")
          baseline=os.environ.get("BASELINE_COMPLETED_AT","")
          deadline=time.monotonic()+150
          while time.monotonic() < deadline:
              try:
                  status=json.loads(path.read_text(encoding="utf-8"))
              except (OSError,json.JSONDecodeError):
                  time.sleep(2)
                  continue
              completed=str(status.get("completed_at_utc") or "")
              if completed and completed != baseline:
                  print("FTMO_FRESH_CONTROLLER_STATUS="+json.dumps({
                      "completed_at_utc": completed,
                      "runtime_revision": status.get("runtime_revision"),
                      "controller_action": (status.get("research_controller") or {}).get("action"),
                      "generation_loop_action": ((status.get("research_controller") or {}).get("generation_loop") or {}).get("action"),
                  },sort_keys=True))
                  break
              time.sleep(2)
          else:
              raise SystemExit("no fresh FTMO controller receipt within 150 seconds")
          PY

          "$FTMO_ROOT/.venv/bin/python" -m prop_trading_ai.cli.v1_cpu_attribution \
            --sample-seconds 12 \
            --output /tmp/ftmo-zssh-cpu-attribution.json

          "$FTMO_ROOT/.venv/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root=Path("/opt/ftmo-autonomous")
          status=json.loads((root/".scratch/autonomy/status.json").read_text(encoding="utf-8"))
          cpu=json.loads(Path("/tmp/ftmo-zssh-cpu-attribution.json").read_text(encoding="utf-8"))
          attr=cpu["attribution"]
          research=status.get("research") or {}
          controller=status.get("research_controller") or {}
          loop=controller.get("generation_loop") or {}

          def show(prop: str) -> str:
              return subprocess.run(
                  ["systemctl","show","ftmo-autonomous-marathon.service",f"--property={prop}","--value"],
                  text=True,capture_output=True,check=False,
              ).stdout.strip()

          receipt={
              "schema_version":2,
              "scope":"ftmo-zssh-useful-compute-proof",
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "zssh_source_sha":os.environ.get("GITHUB_SHA"),
              "required_attribution_ancestor":os.environ["REQUIRED_ATTRIBUTION_ANCESTOR"],
              "ftmo_runtime_revision":(root/".scratch/autonomy/deployed-main-sha").read_text(encoding="utf-8").strip(),
              "attribution":attr,
              "service":{
                  "active_state":show("ActiveState"),
                  "sub_state":show("SubState"),
                  "control_group":show("ControlGroup"),
                  "main_pid":show("MainPID"),
                  "cpu_weight":show("CPUWeight"),
                  "cpu_quota_per_sec_usec":show("CPUQuotaPerSecUSec"),
              },
              "controller_receipt":{
                  "completed_at_utc":status.get("completed_at_utc"),
                  "ok":status.get("ok"),
                  "runtime_revision":status.get("runtime_revision"),
                  "generation_number":research.get("generation_number"),
                  "generation_id":research.get("generation_id"),
                  "next_stage":research.get("next_stage"),
                  "controller_action":controller.get("action"),
                  "controller_compute":controller.get("compute"),
                  "generation_loop_action":loop.get("action"),
                  "generation_loop_stage":loop.get("stage"),
                  "generation_loop_outcomes_executed":loop.get("outcomes_executed"),
                  "research_outcomes_executed":(controller.get("outcome_execution") or {}).get("research_outcomes_executed"),
              },
              "autonomous_cloud_budget_usd":status.get("autonomous_cloud_budget_usd"),
              "broker_order_submission_allowed":status.get("broker_order_submission_allowed"),
              "live_trading_allowed":status.get("live_trading_allowed"),
              "walk_forward_accessed":status.get("walk_forward_accessed"),
              "final_holdout_accessed":status.get("final_holdout_accessed"),
              "market_outcomes_accessed":cpu.get("market_outcomes_accessed"),
              "rescue_applied":True,
              "rescue_actions":[
                  "ftmo:CPUWeight=10000",
                  "ftmo:CPUQuota=500%",
                  "haxlab-services:CPUWeight=100",
                  "haxlab-services:CPUQuota=100%",
              ],
          }
          Path("/tmp/ftmo-useful-compute-proof.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+"\n",encoding="utf-8"
          )
          print("FTMO_ZSSH_RECEIPT="+json.dumps(receipt,sort_keys=True))

          if receipt["service"]["active_state"] != "active":
              raise SystemExit("FTMO marathon inactive")
          if receipt["service"]["cpu_weight"] != "10000":
              raise SystemExit("FTMO CPUWeight is not 10000")
          if receipt["service"]["cpu_quota_per_sec_usec"] != "5s":
              raise SystemExit("FTMO CPU quota is not 500%")
          if receipt["broker_order_submission_allowed"] is not False:
              raise SystemExit("broker order boundary changed")
          if receipt["live_trading_allowed"] is not False:
              raise SystemExit("live trading boundary changed")
          if receipt["market_outcomes_accessed"] is not False:
              raise SystemExit("market outcomes were accessed during CPU proof")

          cr=receipt["controller_receipt"]
          provider_retry=(
              cr.get("generation_loop_action")=="provider_foundation_provider_unavailable_retry_later"
              and cr.get("generation_loop_outcomes_executed") is False
          )
          advanced=(cr.get("controller_compute") or {}).get("ok") is True
          if not (provider_retry or advanced):
              raise SystemExit("no valid advanced-compute or sealed-provider-retry controller receipt")

          if attr.get("ftmo_primary_attributed_compute") is not True:
              if not provider_retry:
                  raise SystemExit("FTMO not primary outside a sealed external-provider wait")
              print("FTMO_EXTERNAL_PROVIDER_WAIT_GREEN=sealed retry; CPU rescue remains armed")
          PY

      - name: Persist FTMO useful-compute proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/ftmo-useful-compute-proof.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts/ops
          cp /tmp/ftmo-useful-compute-proof.json artifacts/ops/ftmo-useful-compute-proof.json
          git config user.name "zssh-automation"
          git config user.email "zssh-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-useful-compute-proof.json
          if git diff --cached --quiet; then
            echo "Proof receipt unchanged"
          else
            git commit -m "Record FTMO useful-compute proof"
            git push origin HEAD:main
          fi

      - name: Enforce persisted FTMO proof gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/ops/ftmo-useful-compute-proof.json").read_text(encoding="utf-8"))
          if r.get("service",{}).get("active_state") != "active":
              raise SystemExit("FTMO marathon inactive")
          if r.get("service",{}).get("cpu_weight") != "10000":
              raise SystemExit("FTMO CPUWeight mismatch")
          if r.get("service",{}).get("cpu_quota_per_sec_usec") != "5s":
              raise SystemExit("FTMO CPU quota mismatch")
          if r.get("broker_order_submission_allowed") is not False:
              raise SystemExit("broker order boundary changed")
          if r.get("live_trading_allowed") is not False:
              raise SystemExit("live trading boundary changed")
          cr=r.get("controller_receipt") or {}
          retry=(
              cr.get("generation_loop_action")=="provider_foundation_provider_unavailable_retry_later"
              and cr.get("generation_loop_outcomes_executed") is False
          )
          advanced=(cr.get("controller_compute") or {}).get("ok") is True
          if not (retry or advanced):
              raise SystemExit("controller proof gate failed")
          if (r.get("attribution") or {}).get("ftmo_primary_attributed_compute") is not True and not retry:
              raise SystemExit("FTMO attribution gate failed")
          print("FTMO_USEFUL_COMPUTE_PROOF_GREEN",json.dumps(r,sort_keys=True))
          PY
