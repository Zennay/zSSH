name: FTMO PR407 stale CI cancellation proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr407-stale-ci-cancel-20261002.yml"

permissions:
  contents: write

concurrency:
  group: zssh-ftmo-cancel-merged-pr407-ci-20261002
  cancel-in-progress: false

jobs:
  verify-and-cancel-only-if-active:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Check out zSSH
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact FTMO PR and run scope
        shell: bash
        env:
          EXPECTED_PR407_HEAD: 60fcbbc3562e77013f44830c4db26b69f0167ca1
          EXPECTED_PR407_MERGE: c7a83dae1cc4248e59b6a02d1ec9e0ac8b6dc56b
          EXPECTED_PR408_PROTECTED_HEAD: 482ae9782f941e6926d73d81c76f316ffec4c081
        run: |
          set -euo pipefail
          host="$(hostname)"
          case "$host" in
            vps-bb300bba|vps-bb300bba.*) ;;
            *) echo "Refusing: expected vps-bb300bba, got $host" >&2; exit 1 ;;
          esac
          command -v gh >/dev/null
          gh auth status --hostname github.com >/dev/null 2>&1

          pr407="$(gh api repos/Zennay/Ftmo/pulls/407)"
          state="$(printf '%s' "$pr407" | gh api --method GET /rate_limit >/dev/null 2>&1; printf '%s' "$pr407" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
          merged_at="$(printf '%s' "$pr407" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merged_at") or "")')"
          head="$(printf '%s' "$pr407" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          merge_sha="$(printf '%s' "$pr407" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merge_commit_sha") or "")')"
          test "$state" = closed
          test -n "$merged_at"
          test "$head" = "$EXPECTED_PR407_HEAD"
          test "$merge_sha" = "$EXPECTED_PR407_MERGE"

          pr406_head="$(gh api repos/Zennay/Ftmo/pulls/406 --jq '.head.sha')"
          test "$EXPECTED_PR407_HEAD" != "$EXPECTED_PR408_PROTECTED_HEAD"
          test "$EXPECTED_PR407_HEAD" != "$pr406_head"

          inspect_target() {
            id="$1"
            file="/tmp/ftmo-run-$id.json"
            gh api "repos/Zennay/Ftmo/actions/runs/$id" > "$file"
            python3 - "$file" "$id" "$EXPECTED_PR407_HEAD" "$EXPECTED_PR408_PROTECTED_HEAD" "$pr406_head" <<'PY'
import json, sys
p, expected_id, expected_sha, protected408, pr406 = sys.argv[1:]
d=json.load(open(p, encoding="utf-8"))
assert str(d["id"]) == expected_id, d["id"]
assert d["head_sha"] == expected_sha, d["head_sha"]
assert d["head_sha"] != protected408
assert d["head_sha"] != pr406
assert d["head_branch"] != "main", d["head_branch"]
assert d["event"] == "pull_request", d["event"]
print(f'GUARD_OK id={d["id"]} status={d["status"]} conclusion={d.get("conclusion")} head={d["head_sha"]} branch={d["head_branch"]}')
PY
          }

          inspect_target 36981941923
          inspect_target 36981941937

      - name: Cancel only exact stale runs if still active
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ftmo-pr407-actions.txt
          for id in 36981941923 36981941937; do
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "/tmp/ftmo-run-$id.json")"
            case "$status" in
              queued|pending|in_progress)
                gh api -X POST "repos/Zennay/Ftmo/actions/runs/$id/cancel" >/dev/null
                printf '%s %s\n' "$id" requested_cancel >> /tmp/ftmo-pr407-actions.txt
                ;;
              completed)
                printf '%s %s\n' "$id" already_terminal >> /tmp/ftmo-pr407-actions.txt
                ;;
              *)
                echo "Refusing unknown/non-approved status for $id: $status" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify target terminal state and protected PR408 run state
        shell: bash
        env:
          EXPECTED_PR407_HEAD: 60fcbbc3562e77013f44830c4db26b69f0167ca1
          EXPECTED_PR408_PROTECTED_HEAD: 482ae9782f941e6926d73d81c76f316ffec4c081
        run: |
          set -euo pipefail
          for id in 36981941923 36981941937; do
            terminal=false
            for _ in $(seq 1 30); do
              gh api "repos/Zennay/Ftmo/actions/runs/$id" > "/tmp/ftmo-final-$id.json"
              status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "/tmp/ftmo-final-$id.json")"
              if [ "$status" = completed ]; then terminal=true; break; fi
              sleep 2
            done
            test "$terminal" = true
            python3 - "/tmp/ftmo-final-$id.json" "$id" "$EXPECTED_PR407_HEAD" <<'PY'
import json, sys
p, expected_id, expected_sha = sys.argv[1:]
d=json.load(open(p, encoding="utf-8"))
assert str(d["id"]) == expected_id
assert d["head_sha"] == expected_sha
assert d["head_branch"] != "main"
assert d["status"] == "completed"
print(f'TARGET_TERMINAL id={d["id"]} conclusion={d.get("conclusion")}')
PY
          done

          for id in 36982734136 36982734283; do
            gh api "repos/Zennay/Ftmo/actions/runs/$id" > "/tmp/ftmo-pr408-$id.json"
            python3 - "/tmp/ftmo-pr408-$id.json" "$id" "$EXPECTED_PR408_PROTECTED_HEAD" <<'PY'
import json, sys
p, expected_id, expected_sha = sys.argv[1:]
d=json.load(open(p, encoding="utf-8"))
assert str(d["id"]) == expected_id
assert d["head_sha"] == expected_sha, d["head_sha"]
assert d["head_branch"] != "main"
print(f'PR408_STATUS id={d["id"]} status={d["status"]} conclusion={d.get("conclusion")} head={d["head_sha"]}')
PY
          done

          python3 - <<'PY'
import json, os, socket
from pathlib import Path

def load(path):
    return json.loads(Path(path).read_text(encoding="utf-8"))

actions = {}
for line in Path("/tmp/ftmo-pr407-actions.txt").read_text(encoding="utf-8").splitlines():
    rid, action = line.split()
    actions[rid] = action

target_ids = ["36981941923", "36981941937"]
protected_ids = ["36982734136", "36982734283"]
proof = {
    "schema_version": 1,
    "queue_item": "zssh-ftmo-cancel-merged-pr407-ci-20261002",
    "runner_hostname": socket.gethostname(),
    "zssh_workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
    "pr407": {
        "state": "closed",
        "merged": True,
        "head_sha": "60fcbbc3562e77013f44830c4db26b69f0167ca1",
        "merge_commit_sha": "c7a83dae1cc4248e59b6a02d1ec9e0ac8b6dc56b",
    },
    "targets": [],
    "protected_pr408_runs": [],
}
for rid in target_ids:
    d=load(f"/tmp/ftmo-final-{rid}.json")
    proof["targets"].append({
        "id": d["id"], "name": d["name"], "head_sha": d["head_sha"],
        "head_branch": d["head_branch"], "status": d["status"],
        "conclusion": d.get("conclusion"), "action": actions[rid],
    })
for rid in protected_ids:
    d=load(f"/tmp/ftmo-pr408-{rid}.json")
    proof["protected_pr408_runs"].append({
        "id": d["id"], "name": d["name"], "head_sha": d["head_sha"],
        "head_branch": d["head_branch"], "status": d["status"],
        "conclusion": d.get("conclusion"),
    })
Path("/tmp/ftmo-pr407-stale-ci-cancel-proof.json").write_text(
    json.dumps(proof, sort_keys=True, indent=2) + "\n", encoding="utf-8"
)
print("PROOF_GREEN", json.dumps(proof, sort_keys=True))
PY

      - name: Persist sanitized proof receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts/ops
          cp /tmp/ftmo-pr407-stale-ci-cancel-proof.json artifacts/ops/ftmo-pr407-stale-ci-cancel-proof.json
          git config user.name "zssh-automation"
          git config user.email "zssh-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-pr407-stale-ci-cancel-proof.json
          if git diff --cached --quiet; then
            echo "Proof receipt unchanged"
            exit 0
          fi
          git commit -m "Record PR407 stale CI cancellation proof"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to persist proof after retries" >&2
          exit 1
