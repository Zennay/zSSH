name: FTMO runtime reload proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runtime-reload-proof-20261002.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-runtime-reload-proof-haxlab-20261002
  cancel-in-progress: true

jobs:
  reload-and-prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 7
    env:
      FTMO_ROOT: /opt/ftmo-autonomous
      REQUIRED_REVISION: 3b512f5631984a46072495727214bb7bf03a02ba
      REQUIRED_DEPLOY_RUN_ID: "36949032213"
    steps:
      - name: Check out zSSH proof repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact deployed FTMO recovery target
        shell: bash
        run: |
          set -euo pipefail
          test -d "$FTMO_ROOT"
          test -x "$FTMO_ROOT/.venv/bin/python"
          test -f "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha"
          test -f "$FTMO_ROOT/.scratch/autonomy/deployed-workflow-run-id"
          test -f "$FTMO_ROOT/scripts/run-autonomous-marathon.sh"
          test -f "$FTMO_ROOT/src/prop_trading_ai/ops/autonomous_rollover.py"
          revision="$(tr -d '\r\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha")"
          deploy_run="$(tr -d '\r\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-workflow-run-id")"
          test "$revision" = "$REQUIRED_REVISION"
          test "$deploy_run" = "$REQUIRED_DEPLOY_RUN_ID"
          grep -Fq 'deployment marker changed during provider backoff; resuming research immediately' "$FTMO_ROOT/scripts/run-autonomous-marathon.sh"
          grep -Fq 'RESEARCH_PROVIDER_ACQUISITION_TIMEOUT_SECONDS = 120' "$FTMO_ROOT/src/prop_trading_ai/ops/autonomous_rollover.py"
          pre_pid="$(systemctl show ftmo-autonomous-marathon.service -p MainPID --value)"
          test "$pre_pid" -gt 0
          echo "FTMO_PRE_RELOAD_PID=$pre_pid" >> "$GITHUB_ENV"
          echo "FTMO_DEPLOYED_REVISION=$revision"
          echo "FTMO_DEPLOYED_RUN_ID=$deploy_run"

      - name: Reload persistent marathon into deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          # This is a service-process reload only. Do not invoke v1_autonomous_tick
          # manually; the persistent systemd service remains the sole tick writer.
          sudo -n systemctl restart ftmo-autonomous-marathon.service
          for _ in $(seq 1 30); do
            state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
            if [ "$state" = active ]; then
              break
            fi
            sleep 2
          done
          test "$(systemctl is-active ftmo-autonomous-marathon.service)" = active
          post_pid="$(systemctl show ftmo-autonomous-marathon.service -p MainPID --value)"
          test "$post_pid" -gt 0
          test "$post_pid" != "$FTMO_PRE_RELOAD_PID"
          echo "FTMO_POST_RELOAD_PID=$post_pid" >> "$GITHUB_ENV"
          echo "FTMO_MARATHON_RELOADED=$FTMO_PRE_RELOAD_PID->$post_pid"

      - name: Observe fresh autonomous safe heartbeat
        shell: bash
        run: |
          set -euo pipefail
          "$FTMO_ROOT/.venv/bin/python" - <<'PY'
          from __future__ import annotations
          import json, os, time
          from pathlib import Path

          root=Path(os.environ["FTMO_ROOT"])
          status_path=root/".scratch/autonomy/status.json"
          required_revision=os.environ["REQUIRED_REVISION"]
          required_run=os.environ["REQUIRED_DEPLOY_RUN_ID"]
          baseline=None
          if status_path.is_file() and not status_path.is_symlink():
              try:
                  baseline=json.loads(status_path.read_text(encoding="utf-8")).get("research_cycle_completed_at_utc")
              except Exception:
                  baseline=None

          deadline=time.monotonic()+240
          last=None
          while time.monotonic() < deadline:
              try:
                  status=json.loads(status_path.read_text(encoding="utf-8"))
              except (OSError,json.JSONDecodeError):
                  time.sleep(2)
                  continue
              research=status.get("research") or {}
              controller=status.get("research_controller") or {}
              loop=controller.get("generation_loop") or {}
              outcome=controller.get("outcome_execution") or {}
              last={
                  "research_cycle_completed_at_utc":status.get("research_cycle_completed_at_utc"),
                  "runtime_revision":status.get("runtime_revision"),
                  "deployment_workflow_run_id":str(status.get("deployment_workflow_run_id") or ""),
                  "research_cycle_ok":status.get("research_cycle_ok"),
                  "generation_number":research.get("generation_number"),
                  "next_stage":research.get("next_stage"),
                  "controller_action":controller.get("action"),
                  "generation_loop_action":loop.get("action"),
                  "walk_forward_accessed":outcome.get("walk_forward_accessed"),
                  "final_holdout_accessed":outcome.get("final_holdout_accessed"),
              }
              fresh=bool(last["research_cycle_completed_at_utc"]) and last["research_cycle_completed_at_utc"] != baseline
              if (
                  fresh
                  and last["runtime_revision"] == required_revision
                  and last["deployment_workflow_run_id"] == required_run
                  and last["research_cycle_ok"] is True
              ):
                  if (controller.get("compute") or {}).get("ok") is not True:
                      raise SystemExit(f"controller compute unhealthy: {controller}")
                  if loop.get("enabled") is not True:
                      raise SystemExit(f"generation loop disabled: {loop}")
                  if status.get("live_trading_allowed") is not False or status.get("broker_order_submission_allowed") is not False:
                      raise SystemExit("top-level live/broker safety boundary changed")
                  if outcome.get("live_trading_allowed") is not False or outcome.get("broker_order_submission_allowed") is not False:
                      raise SystemExit("controller live/broker safety boundary changed")
                  if outcome.get("walk_forward_accessed") is True and research.get("walk_forward_access_allowed") is not True:
                      raise SystemExit("walk-forward accessed without gate")
                  if outcome.get("final_holdout_accessed") is True and research.get("final_holdout_access_allowed") is not True:
                      raise SystemExit("final holdout accessed without gate")
                  proof={
                      "schema_version":1,
                      "scope":"ftmo-runtime-reload-proof",
                      "zssh_workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
                      "required_ftmo_revision":required_revision,
                      "required_ftmo_deploy_run_id":required_run,
                      "pre_reload_pid":os.environ["FTMO_PRE_RELOAD_PID"],
                      "post_reload_pid":os.environ["FTMO_POST_RELOAD_PID"],
                      "service_active":True,
                      "status":{
                          **last,
                          "research":research,
                          "controller_compute_ok":(controller.get("compute") or {}).get("ok"),
                          "generation_loop_enabled":loop.get("enabled"),
                          "generation_loop_stage":loop.get("stage"),
                          "generation_loop_outcomes_executed":loop.get("outcomes_executed"),
                          "provider_validation_accepted":loop.get("provider_validation_accepted"),
                          "research_outcomes_executed":outcome.get("research_outcomes_executed"),
                          "live_trading_allowed":status.get("live_trading_allowed"),
                          "broker_order_submission_allowed":status.get("broker_order_submission_allowed"),
                          "walk_forward_access_allowed":research.get("walk_forward_access_allowed"),
                          "final_holdout_access_allowed":research.get("final_holdout_access_allowed"),
                      },
                  }
                  Path("/tmp/ftmo-runtime-reload-proof.json").write_text(
                      json.dumps(proof,sort_keys=True,indent=2)+"\n",encoding="utf-8"
                  )
                  print("FTMO_RUNTIME_RELOAD_PROOF_GREEN",json.dumps(proof,sort_keys=True))
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit(f"no fresh exact-revision research heartbeat after service reload; last={last!r}")
          PY

      - name: Persist sanitized reload proof
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/ftmo-runtime-reload-proof.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts/ops
          cp /tmp/ftmo-runtime-reload-proof.json artifacts/ops/ftmo-runtime-reload-proof.json
          git config user.name "zssh-automation"
          git config user.email "zssh-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-runtime-reload-proof.json
          if git diff --cached --quiet; then
            echo "Proof receipt unchanged"
          else
            git commit -m "Record FTMO runtime reload proof"
            git push origin HEAD:main
          fi
