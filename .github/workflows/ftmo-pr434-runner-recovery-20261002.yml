name: zSSH recover FTMO runner for PR434

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr434-runner-recovery-20261002.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zssh-ftmo-pr434-runner-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      QUEUE_ID: zssh-ftmo-pr434-runner-recovery-20261002
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
      TARGET_SHA: 2bbc0334ec05de2d66558c5284ef2977c466ca97
      PROTECTED_RUNS: "37001378862 37001378965 37001378853"
    steps:
      - name: Check out zSSH main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify VPS and live SQLite assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          if [[ "${RUNNER_NAME:-}" == "vps-bb300bba-ftmo" ]]; then
            echo "Refusing FTMO-runner self-recovery" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          queue_id = os.environ["QUEUE_ID"]
          with urllib.request.urlopen(
              "http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10
          ) as response:
              payload = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      hit = find(child)
                      if hit:
                          return hit
              elif isinstance(value, list):
                  for child in value:
                      hit = find(child)
                      if hit:
                          return hit
              return None

          item = find(payload)
          if not item:
              raise SystemExit(f"{queue_id} missing from live SQLite queue")
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"wrong project: {item.get('project_id')!r}")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"wrong priority: {item.get('priority')!r}")
          if str(item.get("status") or "").lower() not in {
              "queued", "claimed", "running", "verifying", "in_progress"
          }:
              raise SystemExit(f"queue item not runnable: {item.get('status')!r}")
          print("ZSSH_PR434_QUEUE_GREEN", json.dumps({
              "queue_id": item.get("queue_id"),
              "status": item.get("status"),
              "worker_slot": item.get("worker_slot"),
              "updated_at": item.get("updated_at"),
          }, sort_keys=True))
          PY

      - name: Diagnose FTMO runner and fresh OOM evidence
        shell: bash
        run: |
          set -euo pipefail
          systemctl show "$FTMO_SERVICE"             -p ActiveState -p SubState -p MainPID -p NRestarts             -p Result -p ExecMainCode -p ExecMainStatus             -p ActiveEnterTimestamp -p InactiveEnterTimestamp --no-pager || true
          echo "FTMO_RUNNER_PROCESSES_BEGIN"
          ps -o pid=,ppid=,lstart=,etime=,cmd= -u "$FTMO_RUN_USER"             | grep -E 'Runner\.(Worker|Listener)|runsvc\.sh' || true
          echo "FTMO_RUNNER_PROCESSES_END"
          echo "FTMO_KERNEL_OOM_FRESH_BEGIN"
          (sudo -n journalctl -k --since "-60 min" --no-pager 2>/dev/null ||             journalctl -k --since "-60 min" --no-pager 2>/dev/null || true)             | grep -Eai 'out of memory|oom|killed process|memory cgroup'             | tail -160 || true
          echo "FTMO_KERNEL_OOM_FRESH_END"

      - name: Recover only dedicated FTMO Actions listener
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          pre_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pre_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker_before=0
          listener_before=0

          if pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            worker_before=1
          fi
          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            cmd="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            if [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]]; then
              listener_before=1
            fi
          fi
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid listener=$listener_before worker=$worker_before"

          if [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl start "$FTMO_SERVICE"
            action=start-inactive-listener
          elif [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$listener_before" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-unhealthy-listener
          fi

          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            [[ "$post_state" == "active" ]] && break
            sleep 2
          done
          test "${post_state:-}" = "active"
          post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value)"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$post_pid/cmdline"
          post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
          [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]]

          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "FTMO_RUNNER_POST state=$post_state pid=$post_pid listener=1"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pre_state=$pre_state" >> "$GITHUB_OUTPUT"
          echo "pre_pid=$pre_pid" >> "$GITHUB_OUTPUT"
          echo "worker_before=$worker_before" >> "$GITHUB_OUTPUT"
          echo "post_state=$post_state" >> "$GITHUB_OUTPUT"
          echo "post_pid=$post_pid" >> "$GITHUB_OUTPUT"

      - name: Verify protected PR434 exact-head scheduling
        id: scheduling
        shell: bash
        run: |
          set -euo pipefail
          scheduled_run=""
          for attempt in $(seq 1 45); do
            for run_id in $PROTECTED_RUNS; do
              payload="$(gh api "repos/Zennay/Ftmo/actions/runs/$run_id")"
              status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
              sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$payload")"
              conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion"))' <<<"$payload")"
              test "$sha" = "$TARGET_SHA"
              echo "FTMO_PR434_PROTECTED run_id=$run_id status=$status conclusion=$conclusion sha=$sha"
              if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
                scheduled_run="$run_id"
              fi
            done
            [[ -n "$scheduled_run" ]] && break
            sleep 4
          done
          if [[ -z "$scheduled_run" ]]; then
            echo "No protected exact-head run scheduled in bounded window" >&2
            exit 1
          fi
          echo "FTMO_PR434_SCHEDULING_GREEN run_id=$scheduled_run"
          echo "scheduled_run=$scheduled_run" >> "$GITHUB_OUTPUT"

      - name: Persist sanitized recovery receipt
        env:
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
          PRE_STATE: ${{ steps.recovery.outputs.pre_state }}
          PRE_PID: ${{ steps.recovery.outputs.pre_pid }}
          WORKER_BEFORE: ${{ steps.recovery.outputs.worker_before }}
          POST_STATE: ${{ steps.recovery.outputs.post_state }}
          POST_PID: ${{ steps.recovery.outputs.post_pid }}
          SCHEDULED_RUN: ${{ steps.scheduling.outputs.scheduled_run }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr434-runner-recovery-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket, subprocess
          protected = []
          for run_id in os.environ["PROTECTED_RUNS"].split():
              data = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/Zennay/Ftmo/actions/runs/{run_id}"], text=True
              ))
              protected.append({
                  "run_id": int(run_id),
                  "name": data.get("name"),
                  "status": data.get("status"),
                  "conclusion": data.get("conclusion"),
                  "head_sha": data.get("head_sha"),
                  "updated_at": data.get("updated_at"),
              })
          oom = subprocess.run(
              ["bash", "-lc",
               "(sudo -n journalctl -k --since '-60 min' --no-pager 2>/dev/null || "
               "journalctl -k --since '-60 min' --no-pager 2>/dev/null || true) | "
               "grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -80"],
              text=True, capture_output=True
          ).stdout.strip().splitlines()
          processes = subprocess.run(
              ["bash", "-lc",
               "ps -o pid=,ppid=,lstart=,etime=,cmd= -u ftmo-runner | "
               "grep -E 'Runner\\.(Worker|Listener)|runsvc\\.sh' || true"],
              text=True, capture_output=True
          ).stdout.strip().splitlines()
          print(json.dumps({
              "schema_version": 1,
              "queue_id": os.environ["QUEUE_ID"],
              "project": "zssh",
              "host": socket.gethostname(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "execution_runner": os.environ.get("RUNNER_NAME"),
              "service": os.environ["FTMO_SERVICE"],
              "target_sha": os.environ["TARGET_SHA"],
              "pre_state": os.environ.get("PRE_STATE"),
              "pre_pid": os.environ.get("PRE_PID"),
              "worker_before": os.environ.get("WORKER_BEFORE"),
              "recovery_action": os.environ.get("RECOVERY_ACTION"),
              "post_state": os.environ.get("POST_STATE"),
              "post_pid": os.environ.get("POST_PID"),
              "scheduled_protected_run": int(os.environ["SCHEDULED_RUN"]),
              "protected_runs": protected,
              "runner_processes": processes,
              "fresh_oom_evidence": oom,
          }, sort_keys=True, indent=2))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr434-runner-recovery-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zSSH/contents/$path"             -f message="Record FTMO PR434 runner recovery ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_PR434_RECOVERY_RECEIPT_PATH=$path"

      - name: Finalize exact SQLite queue item
        env:
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
          PRE_STATE: ${{ steps.recovery.outputs.pre_state }}
          PRE_PID: ${{ steps.recovery.outputs.pre_pid }}
          POST_STATE: ${{ steps.recovery.outputs.post_state }}
          POST_PID: ${{ steps.recovery.outputs.post_pid }}
          SCHEDULED_RUN: ${{ steps.scheduling.outputs.scheduled_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sqlite3, sys
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?", (queue_id,)
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != "zssh":
              raise SystemExit("queue project mismatch")

          evidence = (
              f"FTMO Actions runner recovery proven by zSSH workflow {os.environ['GITHUB_RUN_ID']}; "
              f"service={os.environ['FTMO_SERVICE']} pre={os.environ.get('PRE_STATE')} pid={os.environ.get('PRE_PID')} "
              f"action={os.environ.get('RECOVERY_ACTION')} post={os.environ.get('POST_STATE')} pid={os.environ.get('POST_PID')}; "
              f"protected exact-head run {os.environ.get('SCHEDULED_RUN')} reached scheduled state for "
              f"{os.environ['TARGET_SHA']}. No protected run was cancelled or rerun and FTMO application/runtime was not modified."
          )

          if item["status"] == "done" and int(item["eligible"] or 0) == 0 and item["worker_slot"] is None:
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]), queue_id, "DONE", evidence
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  f"refusing nonstandard queue mutation: status={item['status']} "
                  f"eligible={item['eligible']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?", (queue_id,)
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0 or final["worker_slot"] is not None:
              raise SystemExit("queue final state is not done/eligible=0/unclaimed")
          print("ZCLOUD_SQLITE_QUEUE_DONE_GREEN=1")
          PY
